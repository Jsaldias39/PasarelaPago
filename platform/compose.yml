# Stack local de la pasarela (P1.H1.M1). Puertos altos (54xxx) para no chocar con nada del equipo.
#   docker compose -f platform/compose.yml up -d          → núcleo (verificado)
#   docker compose -f platform/compose.yml --profile full up -d → suma TigerBeetle, Svix y OpenBao (sin verificar: ver platform/README.md)
# Credenciales: solo desarrollo local. TODOS los puertos publicados escuchan solo en 127.0.0.1 (revisión de seguridad:
# Redis y NATS van sin autenticación porque no son alcanzables fuera de la máquina; no uses este archivo en un servidor).
name: pay

x-healthy: &healthy
  interval: 5s
  timeout: 5s
  retries: 20
  start_period: 5s

services:
  postgres:
    image: ${HUB:-docker.io}/library/postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: pay
      # Crear una base por servicio es lento en discos de CI/VM; sin esto `pg_ctl` se rinde a los 60 s al apagar la inicialización.
      PGCTLTIMEOUT: "300"
    # SOLO desarrollo local: sin fsync el stack arranca rápido y un corte de luz puede corromper los datos (son descartables).
    # max_connections=400: cada suite de pruebas abre un pool de hasta 60 conexiones; con 100 (el valor por defecto)
    # tres suites a la vez agotan los cupos y fallan pruebas de concurrencia por "too many clients" (ENVIRONMENT, ola 1).
    command: ["postgres", "-c", "fsync=off", "-c", "synchronous_commit=off", "-c", "full_page_writes=off", "-c", "max_connections=400"]
    ports: ["127.0.0.1:54321:5432"]
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./postgres/init-databases.sh:/docker-entrypoint-initdb.d/10-init-databases.sh:ro
    healthcheck:
      <<: *healthy
      test: ["CMD-SHELL", "pg_isready -U postgres -d pay_test"]

  nats:
    image: ${HUB:-docker.io}/library/nats:2.10-alpine
    command: ["-js", "-sd", "/data", "-m", "8222"]
    ports: ["127.0.0.1:54222:4222", "127.0.0.1:54822:8222"]
    volumes: [nats_data:/data]
    healthcheck:
      <<: *healthy
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8222/healthz | grep -q ok"]

  redis:
    image: ${HUB:-docker.io}/library/redis:7-alpine
    ports: ["127.0.0.1:54379:6379"]
    healthcheck:
      <<: *healthy
      test: ["CMD", "redis-cli", "ping"]

  temporal-db:
    image: ${HUB:-docker.io}/library/postgres:16-alpine
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: dev_only_temporal
    volumes: [temporal_pg_data:/var/lib/postgresql/data]
    healthcheck:
      <<: *healthy
      test: ["CMD-SHELL", "pg_isready -U temporal"]

  temporal:
    image: ${HUB:-docker.io}/temporalio/auto-setup:1.25
    depends_on:
      temporal-db: { condition: service_healthy }
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: temporal
      POSTGRES_PWD: dev_only_temporal
      POSTGRES_SEEDS: temporal-db
    ports: ["127.0.0.1:54233:7233"]
    healthcheck:
      <<: *healthy
      start_period: 40s
      test: ["CMD-SHELL", "tctl --address $$(hostname -i):7233 cluster health | grep -q SERVING"]

  jaeger:
    image: ${HUB:-docker.io}/jaegertracing/all-in-one:1.62.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports: ["127.0.0.1:54686:16686", "127.0.0.1:54317:4317", "127.0.0.1:54318:4318"]
    healthcheck:
      <<: *healthy
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:14269/ >/dev/null"]

  # SOLO SANDBOX: `v2-static` trae las listas OFAC CONGELADAS de 2019 (7.379 registros) para arrancar sin internet.
  # Sirve para ejercitar la mecánica de `pay-risk`, NUNCA para cribar personas reales. En producción las listas
  # vigentes se cargan desde un caché propio (docs/spikes/watchman.md). API de negocio :8084 (sin autenticación: red interna).
  watchman:
    image: ${HUB:-docker.io}/moov/watchman:v2-static
    environment:
      INCLUDED_LISTS: us_ofac   # sin esto carga 0 listas (verificado)
    ports: ["127.0.0.1:54084:8084"]
    healthcheck:
      <<: *healthy
      start_period: 30s
      # La imagen no trae wget ni curl: se usa /dev/tcp de bash y se exige que la lista tenga registros.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8084 && printf 'GET /v2/listinfo HTTP/1.0\\r\\n\\r\\n' >&3 && cat <&3 | grep -Eq '\"us_ofac\":[1-9]'"]

  # ---- perfil `full`: SIN VERIFICAR en el entorno donde se escribió. Ver platform/README.md. ----
  tigerbeetle:
    profiles: [full]
    image: ghcr.io/tigerbeetle/tigerbeetle:latest
    entrypoint: ["/bin/sh", "-c"]
    command: ["[ -f /data/0_0.tigerbeetle ] || /tigerbeetle format --cluster=0 --replica=0 --replica-count=1 /data/0_0.tigerbeetle; exec /tigerbeetle start --addresses=0.0.0.0:3000 /data/0_0.tigerbeetle"]
    ports: ["127.0.0.1:54300:3000"]
    volumes: [tb_data:/data]
    security_opt: ["seccomp=unconfined"]
    cap_add: ["IPC_LOCK"]

  openbao:
    profiles: [full]
    image: ${HUB:-docker.io}/openbao/openbao:latest
    command: ["server", "-dev", "-dev-root-token-id=dev-only-root", "-dev-listen-address=0.0.0.0:8200"]
    ports: ["127.0.0.1:54200:8200"]
    cap_add: ["IPC_LOCK"]

  svix-db:
    profiles: [full]
    image: ${HUB:-docker.io}/library/postgres:16-alpine
    environment:
      POSTGRES_USER: svix
      POSTGRES_PASSWORD: dev_only_svix
      POSTGRES_DB: svix
    healthcheck:
      <<: *healthy
      test: ["CMD-SHELL", "pg_isready -U svix"]

  svix:
    profiles: [full]
    # Versión fijada (P1.H3.M1): `SvixEngine` se verificó contra svix-server 1.104.0 (su /api/v1/openapi.json). `latest` no es reproducible.
    image: ${HUB:-docker.io}/svix/svix-server:v1.104.0
    depends_on:
      svix-db: { condition: service_healthy }
      redis: { condition: service_healthy }
    # Para que el servidor alcance el receptor de prueba del anfitrión por un nombre público-con-forma (solo lo usan las pruebas de integración;
    # `host.docker.internal` no sirve: el guard de SSRF de pay-webhooks rechaza el sufijo `.internal`).
    extra_hosts: ["receptor.comercio.example:host-gateway"]
    environment:
      SVIX_DB_DSN: postgresql://svix:dev_only_svix@svix-db/svix
      SVIX_REDIS_DSN: redis://redis:6379
      SVIX_QUEUE_TYPE: redis
      SVIX_JWT_SECRET: dev-only-change-me
      SVIX_CACHE_TYPE: redis
      # Contrato público: la entrega lleva `webhook-id`, `webhook-timestamp` y `webhook-signature` (Standard Webhooks), no `svix-*`.
      SVIX_WHITELABEL_HEADERS: "true"
      # Defensa en profundidad: pay-webhooks ya exige https al registrar; el servidor tampoco entrega por http.
      SVIX_ENDPOINT_HTTPS_ONLY: "true"
      # Perillas SOLO de pruebas locales (cerradas por defecto). Las pruebas de integración de pay-webhooks piden al levantar el servicio:
      #   SVIX_WHITELIST_NAMES='["receptor.comercio.example"]' SVIX_DANGEROUS_DISABLE_TLS_VERIFICATION=true SVIX_RETRY_SCHEDULE=1,2,3
      # (nombre del anfitrión permitido, confianza en el certificado autofirmado del receptor, escalera de reintentos corta).
      # Nunca en producción: permiten entregar a la red local y no validan certificados.
      SVIX_WHITELIST_NAMES: ${SVIX_WHITELIST_NAMES:-[]}
      SVIX_DANGEROUS_DISABLE_TLS_VERIFICATION: ${SVIX_DANGEROUS_DISABLE_TLS_VERIFICATION:-false}
      SVIX_RETRY_SCHEDULE: ${SVIX_RETRY_SCHEDULE:-5,300,1800,7200,18000,36000,36000}
    ports: ["127.0.0.1:54800:8071"]

volumes:
  pg_data:
  nats_data:
  temporal_pg_data:
  tb_data:
