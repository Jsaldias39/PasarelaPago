# API pública v1 de la pasarela. BORRADOR de la ola 0 (`v1-draft`): todavía NO está congelada.
# La forma es de P1; la semántica de cada recurso, de su dueño (ver `x-owner`).
openapi: 3.1.0
info:
  title: Pasarela de pagos ALOVIDA — API pública
  version: 1.0.0-draft
  description: |
    Todo cobro del ecosistema ALOVIDA pasa por esta API (proceso 7.4). Modo orquestador (D-02).
    Autenticación con clave de API del comercio (`Authorization: Bearer sk_test_…` o `sk_live_…`).
    Las claves `test` operan contra el sandbox y nunca mueven dinero real.

    ## Errores uniformes

    Toda operación puede responder, además de lo que declara en particular: `401 unauthorized` (clave ausente, mal formada, revocada,
    de otro modo o con el secreto equivocado: siempre la misma respuesta), `403 forbidden` / `merchant_suspended`, `422` (cuerpo,
    parámetro o campo inválido, parámetro de consulta desconocido, JSON ilegible o un número de tarjeta en el cuerpo:
    `card_number_detected`), `429 rate_limited` (con `Retry-After`) y, cuando el servicio dueño no contesta, `502 upstream_error`,
    `503 upstream_unavailable` (con `Retry-After`) o `504 upstream_timeout`. Las operaciones que mueven dinero y devuelven `5xx`,
    `502`, `503` o `504` tienen un resultado **ambiguo**: no prueban que no se ejecutaron; se reintenta con la MISMA `Idempotency-Key`
    o se consulta el recurso. Todo `POST` exige `Idempotency-Key` (`400 idempotency_key_required`) y puede responder `409
    idempotency_request_in_progress`.

    ## Modo

    El modo de la petición lo fija la clave (`sk_test_…` o `sk_live_…`), no el cliente: `pay-edge` lo toma del registro de la clave y lo
    reenvía a los servicios dueños en `X-Pay-Mode: test|live`, descartando cualquier `X-Pay-Mode`, `X-Merchant-Id` o `X-Service-Id` que
    mande el cliente (D-28). Una clave `test` solo opera contra un despliegue `sandbox`, y una `live` contra uno `live`. En un despliegue
    `sandbox` toda respuesta lleva además `X-Pay-Mode: sandbox` (cabecera `XPayModeSandbox` de `common.yaml`) y `Cache-Control: no-store`.

    ## Repetición con la misma `Idempotency-Key`

    Repetir una petición idéntica devuelve la respuesta guardada, con `Idempotency-Replayed: true` y el mismo estado. La excepción son
    las respuestas que traen un secreto: `POST /api_keys` y `POST /api_keys/{id}/rotate` responden `200` **sin el secreto** (el secreto
    se muestra una sola vez); `POST /webhook_endpoints` y `POST /webhook_endpoints/{id}/rotate_secret` repiten el mismo cuerpo, secreto
    incluido (`pay-webhooks` lo guarda sellado durante las 24 h de la clave). Con otro cuerpo, `422 idempotency_key_reused`.
servers:
  - url: https://api.pay.example/v1
    description: Marcador. El dominio real se define al desplegar (no se inventa acá).
security:
  - ApiKey: []
tags:
  - { name: Payment intents, description: Cobros (x-owner P3) }
  - { name: Refunds, description: Reembolsos (x-owner P3) }
  - { name: Merchant, description: Comercio y claves (x-owner P5) }
  - { name: Webhooks, description: Endpoints de eventos (x-owner P1) }
  - { name: Balance, description: Saldo y liquidaciones (x-owner P2) }
  - { name: Scheduled payments, description: 'Pagos programados, procesos 7.7 y 7.8 (x-owner P5)' }
paths:
  /payment_intents:
    post:
      operationId: createPaymentIntent
      tags: [Payment intents]
      x-owner: P3
      summary: Crea un cobro
      parameters:
        - $ref: 'common.yaml#/components/parameters/IdempotencyKey'
        - $ref: 'common.yaml#/components/parameters/RequestId'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/PaymentIntentCreate' } } }
      responses:
        '201':
          description: Cobro creado. `next_action` dice qué tiene que hacer el pagador.
          headers:
            X-Request-Id: { $ref: 'common.yaml#/components/headers/XRequestId' }
            Idempotency-Replayed: { $ref: 'common.yaml#/components/headers/IdempotencyReplayed' }
          content: { application/json: { schema: { $ref: '#/components/schemas/PaymentIntent' } } }
        '400': { $ref: 'common.yaml#/components/responses/BadRequest' }
        '401': { $ref: 'common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: 'common.yaml#/components/responses/Forbidden' }
        '409': { $ref: 'common.yaml#/components/responses/Conflict' }
        '422': { $ref: 'common.yaml#/components/responses/Unprocessable' }
        '429': { $ref: 'common.yaml#/components/responses/TooManyRequests' }
        '500': { $ref: 'common.yaml#/components/responses/ServerError' }
        '502': { $ref: 'common.yaml#/components/responses/BadGateway' }
        '503': { $ref: 'common.yaml#/components/responses/ServiceUnavailable' }
        '504': { $ref: 'common.yaml#/components/responses/GatewayTimeout' }
    get:
      operationId: listPaymentIntents
      tags: [Payment intents]
      x-owner: P3
      summary: Lista los cobros del comercio
      parameters:
        - $ref: 'common.yaml#/components/parameters/Limit'
        - $ref: 'common.yaml#/components/parameters/StartingAfter'
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/PaymentIntentStatus' }
        - name: created_from
          in: query
          schema: { $ref: 'common.yaml#/components/schemas/Timestamp' }
        - name: created_to
          in: query
          schema: { $ref: 'common.yaml#/components/schemas/Timestamp' }
      responses:
        '200':
          description: Página de cobros, de más nuevo a más viejo.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: 'common.yaml#/components/schemas/ListMeta'
                  - type: object
                    required: [data]
                    properties: { data: { type: array, items: { $ref: '#/components/schemas/PaymentIntent' } } }
        '401': { $ref: 'common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: 'common.yaml#/components/responses/Forbidden' }
        '422': { $ref: 'common.yaml#/components/responses/Unprocessable' }
        '429': { $ref: 'common.yaml#/components/responses/TooManyRequests' }
        '500': { $ref: 'common.yaml#/components/responses/ServerError' }
        '502': { $ref: 'common.yaml#/components/responses/BadGateway' }
        '503': { $ref: 'common.yaml#/components/responses/ServiceUnavailable' }
        '504': { $ref: 'common.yaml#/components/responses/GatewayTimeout' }
  /payment_intents/{id}:
    get:
      operationId: getPaymentIntent
      tags: [Payment intents]
      x-owner: P3
      summary: Consulta un cobro
      parameters: [{ $ref: '#/components/parameters/PaymentIntentId' }]
      responses:
        '200': { description: El cobro., content: { application/json: { schema: { $ref: '#/components/schemas/PaymentIntent' } } } }
        '401': { $ref: 'common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: 'common.yaml#/components/responses/Forbidden' }
        '404': { $ref: 'common.yaml#/components/responses/NotFound' }
        '422': { $ref: 'common.yaml#/components/responses/Unprocessable' }
        '429': { $ref: 'common.yaml#/components/responses/TooManyRequests' }
        '500': { $ref: 'common.yaml#/components/responses/ServerError' }
        '502': { $ref: 'common.yaml#/components/responses/BadGateway' }
        '503': { $ref: 'common.yaml#/components/responses/ServiceUnavailable' }
        '504': { $ref: 'common.yaml#/components/responses/GatewayTimeout' }
  /payment_intents/{id}/cancel:
    post:
      operationId: cancelPaymentIntent
      tags: [Payment intents]
      x-owner: P3
      summary: Cancela un cobro que todavía no se pagó
      parameters:
        - { $ref: '#/components/parameters/PaymentIntentId' }
        - $ref: 'common.yaml#/components/parameters/IdempotencyKey'
      responses:
        '200': { description: Cobro cancelado., content: { application/json: { schema: { $ref: '#/components/schemas/PaymentIntent' } } } }
        '400': { $ref: 'common.yaml#/components/responses/BadRequest' }
        '401': { $ref: 'common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: 'common.yaml#/components/responses/Forbidden' }
        '404': { $ref: 'common.yaml#/components/responses/NotFound' }
        '409': { $ref: 'common.yaml#/components/responses/Conflict' }
        '422': { $ref: 'common.yaml#/components/responses/Unprocessable' }
        '429': { $ref: 'common.yaml#/components/responses/TooManyRequests' }
        '500': { $ref: 'common.yaml#/components/responses/ServerError' }
        '502': { $ref: 'common.yaml#/components/responses/BadGateway' }
        '503': { $ref: 'common.yaml#/components/responses/ServiceUnavailable' }
        '504': { $ref: 'common.yaml#/components/responses/GatewayTimeout' }
  /payment_intents/{id}/refunds:
    post:
      operationId: createRefund
      tags: [Refunds]
      x-owner: P3
      summary: Reembolsa total o parcialmente un cobro exitoso
      parameters:
        - { $ref: '#/components/parameters/PaymentIntentId' }
        - $ref: 'common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/RefundCreate' } } }
      responses:
        '201': { description: Reembolso creado., content: { application/json: { schema: { $ref: '#/components/schemas/Refund' } } } }
        '400': { $ref: 'common.yaml#/components/responses/BadRequest' }
        '401': { $ref: 'common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: 'common.yaml#/components/responses/Forbidden' }
        '404': { $ref: 'common.yaml#/components/responses/NotFound' }
        '409': { $ref: 'common.yaml#/components/responses/Conflict' }
        '422': { $ref: 'common.yaml#/components/responses/Unprocessable' }
        '429': { $ref: 'common.yaml#/components/responses/TooManyRequests' }
        '500': { $ref: 'common.yaml#/components/responses/ServerError' }
        '502': { $ref: 'common.yaml#/components/responses/BadGateway' }
        '503': { $ref: 'common.yaml#/components/responses/ServiceUnavailable' }
        '504': { $ref: 'common.yaml#/components/responses/GatewayTimeout' }
  /refunds/{id}:
    get:
      operationId: getRefund
      tags: [Refunds]
      x-owner: P3
      summary: Consulta un reembolso
      description: 'Un reembolso `pending` termina en `succeeded` o `failed`; el aviso llega por webhook (`refund.succeeded`, `refund.failed`), y esta consulta permite verificarlo sin esperarlo.'
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, pattern: '^re_[a-z0-9]{10,40}$' } }
      responses:
        '200': { description: El reembolso., content: { application/json: { schema: { $ref: '#/components/schemas/Refund' } } } }
        '401': { $ref: 'common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: 'common.yaml#/components/responses/Forbidden' }
        '404': { $ref: 'common.yaml#/components/responses/NotFound' }
        '422': { $ref: 'common.yaml#/components/responses/Unprocessable' }
        '429': { $ref: 'common.yaml#/components/responses/TooManyRequests' }
        '500': { $ref: 'common.yaml#/components/responses/ServerError' }
        '502': { $ref: 'common.yaml#/components/responses/BadGateway' }
        '503': { $ref: 'common.yaml#/components/responses/ServiceUnavailable' }
        '504': { $ref: 'common.yaml#/components/responses/GatewayTimeout' }
  /merchants/me:
    get:
      operationId: getMerchant
      tags: [Merchant]
      x-owner: P5
      summary: Datos del comercio autenticado, su estado y su tarifa vigente
      responses:
        '200': { description: El comercio., content: { application/json: { schema: { $ref: '#/components/schemas/Merchant' } } } }
        '401': { $ref: 'common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: 'common.yaml#/components/responses/Forbidden' }
        '422': { $ref: 'common.yaml#/components/responses/Unprocessable' }
        '429': { $ref: 'common.yaml#/components/responses/TooManyRequests' }
        '500': { $ref: 'common.yaml#/components/responses/ServerError' }
        '502': { $ref: 'common.yaml#/components/responses/BadGateway' }
        '503': { $ref: 'common.yaml#/components/responses/ServiceUnavailable' }
        '504': { $ref: 'common.yaml#/components/responses/GatewayTimeout' }
  /api_keys:
    post:
      operationId: createApiKey
      tags: [Merchant]
      x-owner: P5
      summary: Crea una clave de API. El secreto se muestra UNA sola vez.
      description: 'Una clave de un modo no crea claves del otro (`403 forbidden`, D-28), y no lista, rota ni revoca las del otro (`404`).'
      parameters: [{ $ref: 'common.yaml#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ApiKeyCreate' } } }
      responses:
        '201': { description: Clave creada., content: { application/json: { schema: { $ref: '#/components/schemas/ApiKeyWithSecret' } } } }
        '200': { description: 'Repetición de la misma petición con la misma `Idempotency-Key`: la clave NO se vuelve a crear y la respuesta NO trae el secreto (`Idempotency-Replayed: true`).', content: { application/json: { schema: { $ref: '#/components/schemas/ApiKey' } } } }
        '400': { $ref: 'common.yaml#/components/responses/BadRequest' }
        '401': { $ref: 'common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: 'common.yaml#/components/responses/Forbidden' }
        '409': { $ref: 'common.yaml#/components/responses/Conflict' }
        '422': { $ref: 'common.yaml#/components/responses/Unprocessable' }
        '429': { $ref: 'common.yaml#/components/responses/TooManyRequests' }
        '500': { $ref: 'common.yaml#/components/responses/ServerError' }
        '502': { $ref: 'common.yaml#/components/responses/BadGateway' }
        '503': { $ref: 'common.yaml#/components/responses/ServiceUnavailable' }
        '504': { $ref: 'common.yaml#/components/responses/GatewayTimeout' }
    get:
      operationId: listApiKeys
      tags: [Merchant]
      x-owner: P5
      summary: Lista las claves (sin secreto)
      responses:
        '200':
          description: Claves del comercio.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: 'common.yaml#/components/schemas/ListMeta'
                  - type: object
                    required: [data]
                    properties: { data: { type: array, items: { $ref: '#/components/schemas/ApiKey' } } }
        '401': { $ref: 'common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: 'common.yaml#/components/responses/Forbidden' }
        '422': { $ref: 'common.yaml#/components/responses/Unprocessable' }
        '429': { $ref: 'common.yaml#/components/responses/TooManyRequests' }
        '500': { $ref: 'common.yaml#/components/responses/ServerError' }
        '502': { $ref: 'common.yaml#/components/responses/BadGateway' }
        '503': { $ref: 'common.yaml#/components/responses/ServiceUnavailable' }
        '504': { $ref: 'common.yaml#/components/responses/GatewayTimeout' }
  /api_keys/{id}/rotate:
    post:
      operationId: rotateApiKey
      tags: [Merchant]
      x-owner: P5
      summary: Rota la clave. La anterior sigue válida durante el periodo de gracia.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, pattern: '^key_[a-z0-9]{10,40}$' } }
        - $ref: 'common.yaml#/components/parameters/IdempotencyKey'
      responses:
        '201': { description: Clave nueva., content: { application/json: { schema: { $ref: '#/components/schemas/ApiKeyWithSecret' } } } }
        '200': { description: 'Repetición de la misma rotación con la misma `Idempotency-Key`: no se crea otra clave y la respuesta NO trae el secreto (`Idempotency-Replayed: true`). Rotar otra vez la misma clave con otra `Idempotency-Key` es `409`.', content: { application/json: { schema: { $ref: '#/components/schemas/ApiKey' } } } }
        '400': { $ref: 'common.yaml#/components/responses/BadRequest' }
        '401': { $ref: 'common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: 'common.yaml#/components/responses/Forbidden' }
        '404': { $ref: 'common.yaml#/components/responses/NotFound' }
        '409': { $ref: 'common.yaml#/components/responses/Conflict' }
        '422': { $ref: 'common.yaml#/components/responses/Unprocessable' }
        '429': { $ref: 'common.yaml#/components/responses/TooManyRequests' }
        '500': { $ref: 'common.yaml#/components/responses/ServerError' }
        '502': { $ref: 'common.yaml#/components/responses/BadGateway' }
        '503': { $ref: 'common.yaml#/components/responses/ServiceUnavailable' }
        '504': { $ref: 'common.yaml#/components/responses/GatewayTimeout' }
  /api_keys/{id}:
    delete:
      operationId: revokeApiKey
      tags: [Merchant]
      x-owner: P5
      summary: Revoca la clave. Deja de servir en segundos (evento `api_key.revoked`).
      parameters: [{ name: id, in: path, required: true, schema: { type: string, pattern: '^key_[a-z0-9]{10,40}$' } }]
      responses:
        '204': { description: Revocada. }
        '401': { $ref: 'common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: 'common.yaml#/components/responses/Forbidden' }
        '404': { $ref: 'common.yaml#/components/responses/NotFound' }
        '422': { $ref: 'common.yaml#/components/responses/Unprocessable' }
        '429': { $ref: 'common.yaml#/components/responses/TooManyRequests' }
        '500': { $ref: 'common.yaml#/components/responses/ServerError' }
        '502': { $ref: 'common.yaml#/components/responses/BadGateway' }
        '503': { $ref: 'common.yaml#/components/responses/ServiceUnavailable' }
        '504': { $ref: 'common.yaml#/components/responses/GatewayTimeout' }
  /webhook_endpoints:
    post:
      operationId: createWebhookEndpoint
      tags: [Webhooks]
      x-owner: P1
      summary: Suscribe una URL a eventos (Standard Webhooks)
      description: >-
        Códigos de `422 validation_failed` por campo: en `url`, `invalid_url`, `https_required`, `credentials_in_url`, `port_not_allowed`,
        `internal_name`, `private_address` y `unresolvable`; en `enabled_events`, `unknown_event_type`; en `endpoint`, `limit_reached`.
        Repetir con la misma `Idempotency-Key` devuelve el mismo cuerpo, secreto incluido.
      parameters: [{ $ref: 'common.yaml#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/WebhookEndpointCreate' } } }
      responses:
        '201': { description: Endpoint creado. El secreto `whsec_…` se muestra una sola vez., content: { application/json: { schema: { $ref: '#/components/schemas/WebhookEndpointWithSecret' } } } }
        '400': { $ref: 'common.yaml#/components/responses/BadRequest' }
        '403': { $ref: 'common.yaml#/components/responses/Forbidden' }
        '409': { $ref: 'common.yaml#/components/responses/Conflict' }
        '422': { $ref: 'common.yaml#/components/responses/Unprocessable' }
        '401': { $ref: 'common.yaml#/components/responses/Unauthorized' }
        '429': { $ref: 'common.yaml#/components/responses/TooManyRequests' }
        '500': { $ref: 'common.yaml#/components/responses/ServerError' }
        '502': { $ref: 'common.yaml#/components/responses/BadGateway' }
        '503': { $ref: 'common.yaml#/components/responses/ServiceUnavailable' }
        '504': { $ref: 'common.yaml#/components/responses/GatewayTimeout' }
    get:
      operationId: listWebhookEndpoints
      tags: [Webhooks]
      x-owner: P1
      summary: Lista los endpoints
      parameters:
        - $ref: 'common.yaml#/components/parameters/Limit'
        - $ref: 'common.yaml#/components/parameters/StartingAfter'
      responses:
        '200':
          description: Endpoints.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: 'common.yaml#/components/schemas/ListMeta'
                  - type: object
                    required: [data]
                    properties: { data: { type: array, items: { $ref: '#/components/schemas/WebhookEndpoint' } } }
        '401': { $ref: 'common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: 'common.yaml#/components/responses/Forbidden' }
        '422': { $ref: 'common.yaml#/components/responses/Unprocessable' }
        '429': { $ref: 'common.yaml#/components/responses/TooManyRequests' }
        '500': { $ref: 'common.yaml#/components/responses/ServerError' }
        '502': { $ref: 'common.yaml#/components/responses/BadGateway' }
        '503': { $ref: 'common.yaml#/components/responses/ServiceUnavailable' }
        '504': { $ref: 'common.yaml#/components/responses/GatewayTimeout' }
  /webhook_endpoints/{id}/rotate_secret:
    post:
      operationId: rotateWebhookSecret
      tags: [Webhooks]
      x-owner: P1
      summary: Rota el secreto. Durante la rotación las entregas llevan las dos firmas.
      description: >-
        Con `signature_scheme: v1a` lo que se devuelve es la clave PÚBLICA `whpk_…` (la que verifica el comercio); la secreta `whsk_…`
        nunca sale. Repetir con la misma `Idempotency-Key` devuelve el mismo cuerpo.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, pattern: '^we_[a-z0-9]{10,40}$' } }
        - $ref: 'common.yaml#/components/parameters/IdempotencyKey'
      responses:
        '200': { description: Secreto nuevo., content: { application/json: { schema: { $ref: '#/components/schemas/WebhookEndpointWithSecret' } } } }
        '400': { $ref: 'common.yaml#/components/responses/BadRequest' }
        '401': { $ref: 'common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: 'common.yaml#/components/responses/Forbidden' }
        '404': { $ref: 'common.yaml#/components/responses/NotFound' }
        '409': { $ref: 'common.yaml#/components/responses/Conflict' }
        '422': { $ref: 'common.yaml#/components/responses/Unprocessable' }
        '429': { $ref: 'common.yaml#/components/responses/TooManyRequests' }
        '500': { $ref: 'common.yaml#/components/responses/ServerError' }
        '502': { $ref: 'common.yaml#/components/responses/BadGateway' }
        '503': { $ref: 'common.yaml#/components/responses/ServiceUnavailable' }
        '504': { $ref: 'common.yaml#/components/responses/GatewayTimeout' }
  /webhook_endpoints/{id}:
    delete:
      operationId: deleteWebhookEndpoint
      tags: [Webhooks]
      x-owner: P1
      summary: Elimina el endpoint
      description: 'Borrarlo dos veces es `404` la segunda: el recurso ya no existe.'
      parameters: [{ name: id, in: path, required: true, schema: { type: string, pattern: '^we_[a-z0-9]{10,40}$' } }]
      responses:
        '204': { description: Eliminado. }
        '401': { $ref: 'common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: 'common.yaml#/components/responses/Forbidden' }
        '404': { $ref: 'common.yaml#/components/responses/NotFound' }
        '422': { $ref: 'common.yaml#/components/responses/Unprocessable' }
        '429': { $ref: 'common.yaml#/components/responses/TooManyRequests' }
        '500': { $ref: 'common.yaml#/components/responses/ServerError' }
        '502': { $ref: 'common.yaml#/components/responses/BadGateway' }
        '503': { $ref: 'common.yaml#/components/responses/ServiceUnavailable' }
        '504': { $ref: 'common.yaml#/components/responses/GatewayTimeout' }
  /balance:
    get:
      operationId: getBalance
      tags: [Balance]
      x-owner: P2
      summary: Saldo del comercio
      responses:
        '200': { description: Saldo., content: { application/json: { schema: { $ref: '#/components/schemas/Balance' } } } }
        '401': { $ref: 'common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: 'common.yaml#/components/responses/Forbidden' }
        '422': { $ref: 'common.yaml#/components/responses/Unprocessable' }
        '429': { $ref: 'common.yaml#/components/responses/TooManyRequests' }
        '500': { $ref: 'common.yaml#/components/responses/ServerError' }
        '502': { $ref: 'common.yaml#/components/responses/BadGateway' }
        '503': { $ref: 'common.yaml#/components/responses/ServiceUnavailable' }
        '504': { $ref: 'common.yaml#/components/responses/GatewayTimeout' }
  /payouts:
    get:
      operationId: listPayouts
      tags: [Balance]
      x-owner: P2
      summary: Liquidaciones al comercio, de la más nueva a la más vieja
      parameters:
        - $ref: 'common.yaml#/components/parameters/Limit'
        - $ref: 'common.yaml#/components/parameters/StartingAfter'
      responses:
        '200':
          description: Página de liquidaciones.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: 'common.yaml#/components/schemas/ListMeta'
                  - type: object
                    required: [data]
                    properties: { data: { type: array, items: { $ref: '#/components/schemas/Payout' } } }
        '401': { $ref: 'common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: 'common.yaml#/components/responses/Forbidden' }
        '422': { $ref: 'common.yaml#/components/responses/Unprocessable' }
        '429': { $ref: 'common.yaml#/components/responses/TooManyRequests' }
        '500': { $ref: 'common.yaml#/components/responses/ServerError' }
        '502': { $ref: 'common.yaml#/components/responses/BadGateway' }
        '503': { $ref: 'common.yaml#/components/responses/ServiceUnavailable' }
        '504': { $ref: 'common.yaml#/components/responses/GatewayTimeout' }
  /mandates:
    post:
      operationId: createMandate
      tags: [Scheduled payments]
      x-owner: P5
      summary: Programa un pago recurrente (procesos 7.7 y 7.8)
      x-open-question: >-
        Quién puede ser beneficiario (otro comercio de la pasarela o una cuenta externa registrada) y cómo se
        registra una cuenta externa no está definido por el stakeholder. El borrador solo admite beneficiarios
        que ya son comercios de la pasarela. Confirmar con P5 y el dueño antes de congelar.
      parameters: [{ $ref: 'common.yaml#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/MandateCreate' } } }
      responses:
        '201': { description: Mandato creado., content: { application/json: { schema: { $ref: '#/components/schemas/Mandate' } } } }
        '400': { $ref: 'common.yaml#/components/responses/BadRequest' }
        '401': { $ref: 'common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: 'common.yaml#/components/responses/Forbidden' }
        '409': { $ref: 'common.yaml#/components/responses/Conflict' }
        '422': { $ref: 'common.yaml#/components/responses/Unprocessable' }
        '429': { $ref: 'common.yaml#/components/responses/TooManyRequests' }
        '500': { $ref: 'common.yaml#/components/responses/ServerError' }
        '502': { $ref: 'common.yaml#/components/responses/BadGateway' }
        '503': { $ref: 'common.yaml#/components/responses/ServiceUnavailable' }
        '504': { $ref: 'common.yaml#/components/responses/GatewayTimeout' }
    get:
      operationId: listMandates
      tags: [Scheduled payments]
      x-owner: P5
      summary: Lista los mandatos
      parameters:
        - $ref: 'common.yaml#/components/parameters/Limit'
        - $ref: 'common.yaml#/components/parameters/StartingAfter'
      responses:
        '200':
          description: Página de mandatos.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: 'common.yaml#/components/schemas/ListMeta'
                  - type: object
                    required: [data]
                    properties: { data: { type: array, items: { $ref: '#/components/schemas/Mandate' } } }
        '401': { $ref: 'common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: 'common.yaml#/components/responses/Forbidden' }
        '422': { $ref: 'common.yaml#/components/responses/Unprocessable' }
        '429': { $ref: 'common.yaml#/components/responses/TooManyRequests' }
        '500': { $ref: 'common.yaml#/components/responses/ServerError' }
        '502': { $ref: 'common.yaml#/components/responses/BadGateway' }
        '503': { $ref: 'common.yaml#/components/responses/ServiceUnavailable' }
        '504': { $ref: 'common.yaml#/components/responses/GatewayTimeout' }
  /mandates/{id}:
    delete:
      operationId: cancelMandate
      tags: [Scheduled payments]
      x-owner: P5
      summary: Cancela el mandato. Los pagos ya ejecutados no se deshacen.
      parameters: [{ name: id, in: path, required: true, schema: { type: string, pattern: '^md_[a-z0-9]{10,40}$' } }]
      responses:
        '204': { description: Cancelado. }
        '401': { $ref: 'common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: 'common.yaml#/components/responses/Forbidden' }
        '404': { $ref: 'common.yaml#/components/responses/NotFound' }
        '422': { $ref: 'common.yaml#/components/responses/Unprocessable' }
        '429': { $ref: 'common.yaml#/components/responses/TooManyRequests' }
        '500': { $ref: 'common.yaml#/components/responses/ServerError' }
        '502': { $ref: 'common.yaml#/components/responses/BadGateway' }
        '503': { $ref: 'common.yaml#/components/responses/ServiceUnavailable' }
        '504': { $ref: 'common.yaml#/components/responses/GatewayTimeout' }
webhooks:
  event:
    post:
      operationId: receiveWebhookEvent
      tags: [Webhooks]
      x-owner: P1
      summary: Evento que la pasarela entrega al `url` del comercio
      description: 'Lo recibe el comercio, no lo llama. Responder `2xx` confirma la entrega; `410 Gone` deshabilita el endpoint; cualquier otra respuesta se reintenta con espera creciente y, tras varias entregas agotadas seguidas, el endpoint se deshabilita (`too_many_failures`). Las redirecciones no se siguen.'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/WebhookEvent' } } }
      responses:
        '200': { description: Entrega confirmada. }
components:
  securitySchemes:
    ApiKey:
      type: http
      scheme: bearer
      description: Clave de API del comercio. `sk_test_…` (sandbox) o `sk_live_…` (producción). Se guarda solo su hash.
  parameters:
    PaymentIntentId:
      name: id
      in: path
      required: true
      schema: { type: string, pattern: '^pi_[a-z0-9]{10,40}$' }
  schemas:
    PaymentMethodType:
      type: string
      enum: [qr, card, bank_transfer, wallet]
      description: QR interoperable, tarjeta, transferencia bancaria o saldo AloVida (D-03).
    PaymentIntentStatus:
      type: string
      enum: [requires_action, processing, succeeded, failed, canceled, expired]
      description: >-
        `succeeded`, `failed`, `canceled` y `expired` son terminales: un cobro termina en uno solo, pase lo que pase en el medio.
    PaymentIntentCreate:
      type: object
      required: [amount_minor, currency, payment_method]
      additionalProperties: false
      properties:
        amount_minor: { allOf: [{ $ref: 'common.yaml#/components/schemas/AmountMinor' }, { minimum: 1 }] }
        currency: { $ref: 'common.yaml#/components/schemas/Currency' }
        payment_method:
          type: object
          required: [type]
          additionalProperties: false
          properties:
            type: { $ref: '#/components/schemas/PaymentMethodType' }
            card_token:
              type: string
              description: Token del PSP o de `pay-vault`. NUNCA el número de tarjeta (solo si type = card).
              maxLength: 200
            wallet_authorization:
              type: string
              maxLength: 500
              description: >-
                Solo si type = wallet. Token de **un solo uso** que el propio usuario ALOVIDA emite dentro de su sesión
                autenticada, atado al comercio, al importe y a la moneda, con vencimiento de minutos. Sin un token válido
                no se debita ningún saldo: el comercio nunca puede indicar de qué usuario cobrar (IDOR). Un token usado,
                vencido o emitido para otro comercio o importe se rechaza con `forbidden`.
              x-open-question: >-
                Quién emite y verifica el token (el servicio de identidad de ALOVIDA o el monolito) y su formato no están
                definidos (Q-20). Alternativa equivalente: el intento queda `requires_action` hasta que el usuario confirma
                dentro de su sesión.
        description: { type: string, maxLength: 200 }
        payer_name:
          type: string
          minLength: 1
          maxLength: 200
          description: >-
            Nombre del pagador, solo si el comercio lo conoce (D-29). Se criba contra listas de sanciones junto con el
            comercio. Es dato personal: no se devuelve en ninguna respuesta ni evento, y se borra cuando el intento llega a
            un estado terminal. Un pagador invitado sin nombre NO bloquea el cobro.
        expires_in_seconds: { type: integer, minimum: 60, maximum: 86400, default: 3600 }
        metadata: { $ref: 'common.yaml#/components/schemas/Metadata' }
    PaymentIntent:
      type: object
      required: [id, object, amount_minor, currency, status, payment_method_type, fee_minor, net_minor, created_at, expires_at]
      properties:
        id: { type: string, pattern: '^pi_[a-z0-9]{10,40}$' }
        object: { const: payment_intent }
        amount_minor: { $ref: 'common.yaml#/components/schemas/AmountMinor' }
        currency: { $ref: 'common.yaml#/components/schemas/Currency' }
        status: { $ref: '#/components/schemas/PaymentIntentStatus' }
        payment_method_type: { $ref: '#/components/schemas/PaymentMethodType' }
        fee_minor: { allOf: [{ $ref: 'common.yaml#/components/schemas/AmountMinor' }], description: 'Comisión de la pasarela (D-07, redondeo D-20).' }
        net_minor: { allOf: [{ $ref: 'common.yaml#/components/schemas/AmountMinor' }], description: Lo que cobra el comercio. `fee_minor + net_minor = amount_minor`. }
        description: { type: string }
        next_action: { $ref: '#/components/schemas/NextAction' }
        last_error:
          type: [object, 'null']
          description: 'Por qué falló el cobro. `code` es un código estable del catálogo: `insufficient_funds`, `connector_unavailable`, `risk_unavailable`, `risk_denied`, `payment_declined`, `ledger_unavailable`, `merchant_suspended`, `validation_failed` o `internal_error`. `message` es un texto estable por código; el error crudo de un tercero nunca sale.'
          properties: { code: { type: string }, message: { type: string } }
        metadata: { $ref: 'common.yaml#/components/schemas/Metadata' }
        created_at: { $ref: 'common.yaml#/components/schemas/Timestamp' }
        expires_at: { $ref: 'common.yaml#/components/schemas/Timestamp' }
        succeeded_at: { oneOf: [{ $ref: 'common.yaml#/components/schemas/Timestamp' }, { type: 'null' }] }
    NextAction:
      description: Qué tiene que hacer el pagador. Ausente cuando no hay nada pendiente.
      oneOf:
        - type: object
          required: [type, qr]
          properties:
            type: { const: display_qr }
            qr:
              type: object
              required: [payload, expires_at]
              properties:
                payload: { type: string, description: 'Cadena EMVCo MPM (empieza con 000201, termina con 6304 + CRC16).' }
                image_url: { type: string, format: uri }
                expires_at: { $ref: 'common.yaml#/components/schemas/Timestamp' }
        - type: object
          required: [type, bank_transfer]
          properties:
            type: { const: bank_transfer_instructions }
            bank_transfer:
              type: object
              required: [reference, bank_name, account_holder, account_number]
              properties:
                reference: { type: string, description: Referencia única que el pagador debe poner; con ella se concilia. }
                bank_name: { type: string }
                account_holder: { type: string }
                account_number: { type: string }
        - type: object
          required: [type, url]
          properties:
            type: { const: redirect_to_card_form }
            url: { type: string, format: uri, description: Página de pago del banco o campos alojados; el PAN no pasa por la pasarela. }
    RefundCreate:
      type: object
      required: [amount_minor]
      additionalProperties: false
      properties:
        amount_minor: { allOf: [{ $ref: 'common.yaml#/components/schemas/AmountMinor' }, { minimum: 1 }] }
        reason: { type: string, enum: [requested_by_customer, duplicate, fraudulent, other] }
        metadata: { $ref: 'common.yaml#/components/schemas/Metadata' }
    Refund:
      type: object
      required: [id, object, payment_intent, amount_minor, currency, status, created_at]
      properties:
        id: { type: string, pattern: '^re_[a-z0-9]{10,40}$' }
        object: { const: refund }
        payment_intent: { type: string, pattern: '^pi_[a-z0-9]{10,40}$' }
        amount_minor: { $ref: 'common.yaml#/components/schemas/AmountMinor' }
        currency: { $ref: 'common.yaml#/components/schemas/Currency' }
        status: { type: string, enum: [pending, succeeded, failed] }
        reason: { type: string }
        failure_code: { type: [string, 'null'] }
        created_at: { $ref: 'common.yaml#/components/schemas/Timestamp' }
    Merchant:
      type: object
      required: [id, object, status, display_name, fee_schedule]
      properties:
        id: { type: string, pattern: '^mc_[a-z0-9]{10,40}$' }
        object: { const: merchant }
        status: { type: string, enum: [pending, active, suspended, closed] }
        display_name: { type: string }
        fee_schedule:
          type: object
          required: [version, channels]
          properties:
            version: { type: integer }
            channels:
              type: array
              items:
                type: object
                required: [channel, percent]
                properties:
                  channel: { type: string, enum: [qr, card, bank_transfer, wallet, direct] }
                  percent: { type: string, pattern: '^\d{1,3}(\.\d{1,6})?$' }
                  fixed_minor: { $ref: 'common.yaml#/components/schemas/AmountMinor' }
                  min_minor: { $ref: 'common.yaml#/components/schemas/AmountMinor' }
                  cap_minor: { $ref: 'common.yaml#/components/schemas/AmountMinor' }
    ApiKeyCreate:
      type: object
      required: [mode]
      additionalProperties: false
      properties:
        mode: { type: string, enum: [test, live] }
        label: { type: string, maxLength: 80 }
    ApiKey:
      type: object
      required: [id, object, mode, last4, created_at]
      properties:
        id: { type: string, pattern: '^key_[a-z0-9]{10,40}$' }
        object: { const: api_key }
        mode: { type: string, enum: [test, live] }
        label: { type: string }
        last4: { type: string, minLength: 4, maxLength: 4 }
        created_at: { $ref: 'common.yaml#/components/schemas/Timestamp' }
        revoked_at: { oneOf: [{ $ref: 'common.yaml#/components/schemas/Timestamp' }, { type: 'null' }] }
        expires_at: { oneOf: [{ $ref: 'common.yaml#/components/schemas/Timestamp' }, { type: 'null' }], description: Fin del periodo de gracia si la clave se rotó. }
    ApiKeyWithSecret:
      allOf:
        - $ref: '#/components/schemas/ApiKey'
        - type: object
          required: [secret]
          properties: { secret: { type: string, description: 'Se muestra una sola vez; después solo existe su hash.', pattern: '^sk_(test|live)_' } }
    WebhookEventType:
      type: string
      enum:
        - '*'
        - payment_intent.created
        - payment_intent.requires_action
        - payment_intent.processing
        - payment_intent.succeeded
        - payment_intent.failed
        - payment_intent.canceled
        - payment_intent.expired
        - refund.created
        - refund.succeeded
        - refund.failed
        - dispute.opened
        - dispute.won
        - dispute.lost
        - payout.created
        - payout.paid
        - payout.failed
        - mandate.created
        - mandate.canceled
        - scheduled_payment.executed
        - scheduled_payment.failed
        - scheduled_payment.insufficient_funds
    WebhookEvent:
      type: object
      description: >-
        Cuerpo que recibe el comercio (firmado con Standard Webhooks: cabeceras `webhook-id`, `webhook-timestamp`, `webhook-signature`).
        `id` es el id del evento y el mismo `webhook-id`; no cambia en los reintentos. Política de payload: `data.object` lleva SOLO ids,
        estados, códigos, fechas e importes en unidades menores. Un campo que no esté en la lista de permitidos se descarta; un valor con
        correo, teléfono o número de tarjeta hace que el evento ENTERO se rechace y no se entregue (es un defecto del publicador).
      required: [id, object, type, created_at, mode, data]
      properties:
        id: { type: string, format: uuid }
        object: { const: event }
        type: { $ref: '#/components/schemas/WebhookEventType' }
        created_at: { $ref: 'common.yaml#/components/schemas/Timestamp' }
        mode: { type: string, enum: [test, live], description: 'Modo del despliegue que entrega: `sandbox` ⇒ `test`, `live` ⇒ `live`.' }
        data:
          type: object
          required: [object]
          properties:
            object: { type: object, additionalProperties: { type: [string, number, boolean, 'null'] } }
    WebhookEndpointCreate:
      type: object
      required: [url, enabled_events]
      additionalProperties: false
      properties:
        url:
          type: string
          format: uri
          pattern: '^https://'
          description: >-
            Solo HTTPS y solo destinos públicos. `pay-webhooks` resuelve el nombre al registrar y de nuevo en CADA entrega,
            fija la IP resuelta, y rechaza (422 `validation_failed`) los destinos privados, de loopback, link-local, CGNAT,
            de metadatos de nube (169.254.169.254) o nombres de servicios internos. No sigue redirecciones (o revalida cada
            una) y entrega a través de un proxy de salida sin ruta a la red interna (SSRF).
        enabled_events:
          type: array
          minItems: 1
          description: >-
            Tipos de evento a recibir: los 21 públicos listados, o `*` para todos. Cualquier otro (los internos `ledger.*`, `api_key.*`,
            `merchant.*`, `fee_schedule.*`, `connector.*`, `settlement.*`, `reconciliation.*` nunca salen de la pasarela) es
            `422 validation_failed` con `errors[].code = unknown_event_type`.
          items: { $ref: '#/components/schemas/WebhookEventType' }
        signature_scheme: { type: string, enum: [v1, v1a], default: v1, description: 'HMAC-SHA256 (`whsec_`) o Ed25519 (`whpk_`).' }
        description: { type: string, maxLength: 200 }
    WebhookEndpoint:
      type: object
      required: [id, object, url, enabled_events, status, created_at]
      properties:
        id: { type: string, pattern: '^we_[a-z0-9]{10,40}$' }
        object: { const: webhook_endpoint }
        url: { type: string, format: uri }
        enabled_events: { type: array, items: { type: string } }
        status: { type: string, enum: [enabled, disabled] }
        disabled_reason: { type: [string, 'null'], enum: [gone_410, too_many_failures, manual, null] }
        created_at: { $ref: 'common.yaml#/components/schemas/Timestamp' }
    WebhookEndpointWithSecret:
      allOf:
        - $ref: '#/components/schemas/WebhookEndpoint'
        - type: object
          required: [secret]
          properties:
            secret: { type: string, description: 'Secreto `whsec_…` (v1) o clave pública `whpk_…` (v1a); se muestra una sola vez.' }
    Balance:
      type: object
      required: [object, currency, pending_minor, available_minor]
      properties:
        object: { const: balance }
        currency: { $ref: 'common.yaml#/components/schemas/Currency' }
        pending_minor: { allOf: [{ $ref: 'common.yaml#/components/schemas/AmountMinor' }], description: 'Cobrado y todavía no liberado (T+7, D-19).' }
        available_minor: { allOf: [{ $ref: 'common.yaml#/components/schemas/AmountMinor' }], description: Liberado y pagable en el próximo corte. }
        as_of: { $ref: 'common.yaml#/components/schemas/Timestamp' }
    Payout:
      type: object
      required: [id, object, amount_minor, currency, status, period_from, period_to, created_at]
      properties:
        id: { type: string, pattern: '^po_[a-z0-9]{10,40}$' }
        object: { const: payout }
        amount_minor: { $ref: 'common.yaml#/components/schemas/AmountMinor' }
        currency: { $ref: 'common.yaml#/components/schemas/Currency' }
        status: { type: string, enum: [pending, in_transit, paid, failed] }
        failure_code: { type: [string, 'null'] }
        period_from: { $ref: 'common.yaml#/components/schemas/Timestamp' }
        period_to: { $ref: 'common.yaml#/components/schemas/Timestamp' }
        created_at: { $ref: 'common.yaml#/components/schemas/Timestamp' }
    MandateFields:
      type: object
      description: >-
        Campos comunes del mandato. NO lleva `additionalProperties: false`: con `allOf`, esa restricción valdría también para
        los campos que agrega `Mandate` y ninguna respuesta real podría cumplirla. El rechazo de campos desconocidos está en
        `MandateCreate` (`unevaluatedProperties: false`).
      required: [kind, beneficiary_merchant_id, amount_minor, currency, schedule]
      properties:
        kind:
          type: string
          enum: [pay_obligation, pay_commission]
          description: '`pay_obligation`: el médico paga una obligación mensual (7.7). `pay_commission`: un proveedor paga su comisión a ALOVIDA (7.8).'
        beneficiary_merchant_id: { type: string, pattern: '^mc_[a-z0-9]{10,40}$' }
        amount_minor: { allOf: [{ $ref: 'common.yaml#/components/schemas/AmountMinor' }, { minimum: 1 }] }
        currency: { $ref: 'common.yaml#/components/schemas/Currency' }
        schedule:
          type: object
          required: [frequency, day_of_month, start_date]
          additionalProperties: false
          properties:
            frequency: { const: monthly }
            day_of_month: { type: integer, minimum: 1, maximum: 28, description: Hasta 28 para que exista todos los meses. }
            start_date: { type: string, format: date }
            end_date: { type: [string, 'null'], format: date }
        description: { type: string, maxLength: 200 }
    MandateCreate:
      allOf:
        - $ref: '#/components/schemas/MandateFields'
      unevaluatedProperties: false
    Mandate:
      allOf:
        - $ref: '#/components/schemas/MandateFields'
        - type: object
          required: [id, object, status, created_at]
          properties:
            id: { type: string, pattern: '^md_[a-z0-9]{10,40}$' }
            object: { const: mandate }
            status: { type: string, enum: [active, paused_insufficient_funds, canceled, completed] }
            next_run_on: { type: [string, 'null'], format: date }
            created_at: { $ref: 'common.yaml#/components/schemas/Timestamp' }
