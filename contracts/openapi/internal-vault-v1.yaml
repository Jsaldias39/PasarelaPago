# Contrato INTERNO de pay-vault. BORRADOR de la ola 0 (`v1-draft`): no está congelado.
openapi: 3.1.0
info:
  title: pay-vault — API interna v1
  version: 1.0.0-draft
  description: |
    Bóveda de tarjetas (entorno de datos de titulares de tarjeta, PCI DSS). Vive en una **red aislada**: solo la
    alcanzan `pay-payments` y `pay-connectors` (regla de separación 8; tarea P1.H4.M3).

    - **Expone:** P3 (`pay-vault`).
    - **Consume:** `pay-payments` (P3) y `pay-connectors` (P4). Ningún otro servicio, incluido `pay-edge`.
    - **Seguridad:** mTLS + `X-Service-Id`. La bóveda rechaza con `403` a cualquier servicio fuera de esa lista.

    ## Dónde entra el PAN

    **`pay-payments` jamás recibe un número de tarjeta.** El PAN entra *únicamente* por la ruta de captura alojada
    (`capture_sessions`): `pay-payments` abre una sesión, el pagador teclea la tarjeta en un formulario servido por la
    bóveda (o por la página del banco) y solo vuelve un `token`. Ese token es lo que se manda a `card_token` en la API pública.
    El único endpoint que devuelve datos de tarjeta es `reveal`, y solo lo puede llamar `pay-connectors`.

    Nada de este servicio escribe el PAN, el CVV ni el nombre del titular en logs, trazas, eventos ni errores.
servers:
  - url: http://pay-vault:3000
    description: Marcador de la red aislada de la bóveda.
security:
  - mTLS: []
tags:
  - { name: Capture, description: Captura alojada de tarjeta }
  - { name: Tokens, description: Tokens de tarjeta }
paths:
  /capture_sessions:
    post:
      operationId: vaultCreateCaptureSession
      tags: [Capture]
      x-owner: P3
      summary: Abre una sesión de captura de tarjeta
      description: 'Devuelve la URL del formulario alojado. El PAN viaja del navegador del pagador a la bóveda, nunca por `pay-payments`.'
      x-open-question: 'Quién aloja el formulario depende de dos cosas que hoy no están resueltas: (1) si el Banco Mercantil ofrece una página de pago o campos alojados propios (pedido al banco, `docs/spikes/banco-mercantil.md`); (2) si `hyperswitch-card-vault` encaja como bóveda propia (`docs/spikes/card-vault.md`: solo revisión documental, no se ejecutó). Hasta resolverlo, `capture_url` es opaca y puede apuntar a cualquiera de los dos.'
      parameters:
        - $ref: '#/components/parameters/ServiceId'
        - $ref: '#/components/parameters/Traceparent'
        - $ref: 'common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CaptureSessionCreate' } } }
      responses:
        '201': { description: Sesión abierta., content: { application/json: { schema: { $ref: '#/components/schemas/CaptureSession' } } } }
        '400': { $ref: 'common.yaml#/components/responses/BadRequest' }
        '403': { $ref: 'common.yaml#/components/responses/Forbidden' }
        '422': { $ref: 'common.yaml#/components/responses/Unprocessable' }
        '500': { $ref: 'common.yaml#/components/responses/ServerError' }
  /capture_sessions/{id}:
    get:
      operationId: vaultGetCaptureSession
      tags: [Capture]
      x-owner: P3
      summary: Estado de una sesión de captura
      description: 'Cuando el pagador termina, trae el `token`. Nunca trae datos de tarjeta.'
      parameters:
        - $ref: '#/components/parameters/ServiceId'
        - $ref: '#/components/parameters/Traceparent'
        - { name: id, in: path, required: true, schema: { type: string, pattern: '^cs_[a-z0-9]{10,40}$' } }
      responses:
        '200': { description: La sesión., content: { application/json: { schema: { $ref: '#/components/schemas/CaptureSession' } } } }
        '400': { $ref: 'common.yaml#/components/responses/BadRequest' }
        '403': { $ref: 'common.yaml#/components/responses/Forbidden' }
        '404': { $ref: 'common.yaml#/components/responses/NotFound' }
        '500': { $ref: 'common.yaml#/components/responses/ServerError' }
  /tokens/{token}:
    get:
      operationId: vaultGetToken
      tags: [Tokens]
      x-owner: P3
      summary: Metadatos no sensibles de una tarjeta tokenizada
      description: 'Marca, últimos 4, vencimiento y huella. No incluye el número. El token es por comercio: uno de otro comercio responde `404`.'
      parameters:
        - $ref: '#/components/parameters/ServiceId'
        - $ref: '#/components/parameters/Traceparent'
        - $ref: '#/components/parameters/MerchantId'
        - $ref: '#/components/parameters/Token'
      responses:
        '200': { description: Metadatos., content: { application/json: { schema: { $ref: '#/components/schemas/TokenMetadata' } } } }
        '400': { $ref: 'common.yaml#/components/responses/BadRequest' }
        '403': { $ref: 'common.yaml#/components/responses/Forbidden' }
        '404': { $ref: 'common.yaml#/components/responses/NotFound' }
        '500': { $ref: 'common.yaml#/components/responses/ServerError' }
    delete:
      operationId: vaultDeleteToken
      tags: [Tokens]
      x-owner: P3
      summary: Elimina la tarjeta de la bóveda
      description: 'Borra el dato cifrado. Es irreversible; repetirlo sobre un token ya eliminado devuelve `204` (idempotente).'
      parameters:
        - $ref: '#/components/parameters/ServiceId'
        - $ref: '#/components/parameters/Traceparent'
        - $ref: '#/components/parameters/MerchantId'
        - $ref: '#/components/parameters/Token'
      responses:
        '204': { description: Eliminado. }
        '400': { $ref: 'common.yaml#/components/responses/BadRequest' }
        '403': { $ref: 'common.yaml#/components/responses/Forbidden' }
        '404': { $ref: 'common.yaml#/components/responses/NotFound' }
        '500': { $ref: 'common.yaml#/components/responses/ServerError' }
  /tokens/{token}/reveal:
    post:
      operationId: vaultRevealToken
      tags: [Tokens]
      x-owner: P3
      summary: Entrega los datos de tarjeta a pay-connectors para autorizar el cobro
      description: 'Único endpoint que devuelve datos de tarjeta. **Solo `pay-connectors`** (`403` para cualquier otro, incluido `pay-payments`). La respuesta es `Cache-Control: no-store`, se audita cada llamada con el id del cobro y el contenido jamás se registra.'
      x-open-question: 'Un diseño más fuerte sería que la bóveda reenvíe la tarjeta al proveedor (proxy) y no la devuelva nunca. `hyperswitch-card-vault` devuelve la tarjeta en `/retrieve`. Decidir con el equipo de seguridad y el QSA antes de congelar.'
      parameters:
        - $ref: '#/components/parameters/ServiceId'
        - $ref: '#/components/parameters/Traceparent'
        - $ref: '#/components/parameters/MerchantId'
        - $ref: '#/components/parameters/Token'
        - $ref: 'common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [charge_id]
              additionalProperties: false
              properties:
                charge_id: { type: string, pattern: '^ch_[a-z0-9]{10,40}$', description: 'Cobro para el que se usa la tarjeta; queda en la auditoría.' }
      responses:
        '200':
          description: Datos de tarjeta. Contenido sensible.
          headers:
            Cache-Control: { schema: { type: string, enum: [no-store] } }
          content: { application/json: { schema: { $ref: '#/components/schemas/CardData' } } }
        '400': { $ref: 'common.yaml#/components/responses/BadRequest' }
        '403': { $ref: 'common.yaml#/components/responses/Forbidden' }
        '404': { $ref: 'common.yaml#/components/responses/NotFound' }
        '500': { $ref: 'common.yaml#/components/responses/ServerError' }
components:
  securitySchemes:
    mTLS:
      type: mutualTLS
      description: Certificado de servicio. La bóveda solo acepta `pay-payments` y `pay-connectors`.
  parameters:
    ServiceId:
      name: X-Service-Id
      in: header
      required: true
      description: Servicio llamador. Solo `pay-payments` y `pay-connectors`; tiene que coincidir con la identidad del certificado mTLS.
      schema: { type: string, enum: [pay-payments, pay-connectors] }
    Traceparent:
      name: traceparent
      in: header
      required: false
      description: W3C Trace Context.
      schema: { type: string, pattern: '^[0-9a-f]{2}-[0-9a-f]{32}-[0-9a-f]{16}-[0-9a-f]{2}$' }
    MerchantId:
      name: X-Merchant-Id
      in: header
      required: true
      description: Comercio dueño del token. Los tokens son por comercio.
      schema: { type: string, pattern: '^mc_[a-z0-9]{10,40}$' }
    Token:
      name: token
      in: path
      required: true
      schema: { type: string, pattern: '^tok_[a-z0-9]{10,60}$' }
  schemas:
    CaptureSessionCreate:
      type: object
      required: [merchant_id, expires_in_seconds]
      additionalProperties: false
      properties:
        merchant_id: { type: string, pattern: '^mc_[a-z0-9]{10,40}$' }
        payment_intent_id: { type: string, pattern: '^pi_[a-z0-9]{10,40}$', description: 'Opcional: el cobro que originó la captura.' }
        save_card: { type: boolean, default: false, description: 'Si es `false`, el token sirve para un solo cobro y se elimina después.' }
        expires_in_seconds: { type: integer, minimum: 60, maximum: 3600 }
    CaptureSession:
      type: object
      required: [id, object, status, expires_at, created_at]
      properties:
        id: { type: string, pattern: '^cs_[a-z0-9]{10,40}$' }
        object: { const: capture_session }
        status: { type: string, enum: [open, completed, expired, canceled] }
        capture_url: { type: string, format: uri, description: 'Formulario alojado. Solo presente mientras la sesión está `open`.' }
        token: { type: [string, 'null'], pattern: '^tok_[a-z0-9]{10,60}$', description: 'Presente cuando `status` es `completed`.' }
        expires_at: { $ref: 'common.yaml#/components/schemas/Timestamp' }
        created_at: { $ref: 'common.yaml#/components/schemas/Timestamp' }
    TokenMetadata:
      type: object
      required: [token, object, brand, last4, exp_month, exp_year, fingerprint, created_at]
      properties:
        token: { type: string, pattern: '^tok_[a-z0-9]{10,60}$' }
        object: { const: card_token }
        brand: { type: string, enum: [visa, mastercard, other] }
        last4: { type: string, pattern: '^\d{4}$' }
        exp_month: { type: integer, minimum: 1, maximum: 12 }
        exp_year: { type: integer, minimum: 2026, maximum: 2100 }
        fingerprint: { type: string, description: 'Huella opaca de la tarjeta para detectar duplicados sin exponer el número.' }
        single_use: { type: boolean }
        created_at: { $ref: 'common.yaml#/components/schemas/Timestamp' }
    CardData:
      type: object
      x-sensitive: true
      description: 'Datos de tarjeta. **Nunca** se registran, se cachean, se publican en eventos ni se devuelven en errores.'
      required: [number, exp_month, exp_year]
      properties:
        number: { type: string, pattern: '^\d{12,19}$' }
        exp_month: { type: integer, minimum: 1, maximum: 12 }
        exp_year: { type: integer, minimum: 2026, maximum: 2100 }
        holder_name: { type: [string, 'null'], maxLength: 100 }
