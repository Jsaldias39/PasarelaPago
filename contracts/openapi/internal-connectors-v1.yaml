# Contrato INTERNO de pay-connectors. BORRADOR de la ola 0 (`v1-draft`): no está congelado.
openapi: 3.1.0
info:
  title: pay-connectors — API interna v1
  version: 1.0.0-draft
  description: |
    Un adaptador por proveedor detrás de una sola interfaz (`Connector`), ruteo por reglas y recepción de callbacks.

    - **Expone:** P4 (`pay-connectors`).
    - **Consume:** `pay-payments` (P3) para cobrar, reembolsar y consultar estado; `pay-settlement` (P2) para los
      extractos de conciliación y para ordenar payouts por el riel bancario.
    - **Seguridad:** mTLS + `X-Service-Id` en todo salvo `callbacks`, que es público hacia el proveedor y se
      autentica con la verificación propia de cada conector.

    ## Conectores (`connector`) y modo (`mode`)

    | `connector` | Qué es |
    |---|---|
    | `mock` | Simulador (capa sandbox). Mismas respuestas y errores que un proveedor real, sin mover dinero. |
    | `mercantil_qr` | QR interoperable del Banco Mercantil Santa Cruz (D-16). |
    | `mercantil_card` | Adquirencia de tarjetas del Banco Mercantil Santa Cruz (D-17). |
    | `bank_transfer` | Transferencia bancaria conciliada por extracto (D-03). |

    `mode` es `sandbox` o `live`. Un conector en `sandbox` nunca mueve dinero real; el servicio se niega a arrancar un
    conector `mock` si `PAY_MODE=live`.

    ## Lo que NO está definido (no se inventa)

    No hay documentación pública de las APIs del Banco Mercantil Santa Cruz (`docs/spikes/banco-mercantil.md`). Este contrato
    fija **lo que `pay-connectors` promete hacia adentro**, no el formato del banco. Cómo cada adaptador habla con el banco se
    define cuando el banco entregue su documentación (ver `x-open-question`).
servers:
  - url: http://pay-connectors:3000
    description: Marcador de la red interna.
security:
  - mTLS: []
tags:
  - { name: Charges, description: Cobros y reembolsos }
  - { name: Statements, description: Extractos para conciliar }
  - { name: Callbacks, description: Notificaciones del proveedor }
  - { name: Health, description: Salud de los conectores }
paths:
  /charges:
    post:
      operationId: connectorsCreateCharge
      tags: [Charges]
      x-owner: P4
      summary: Crea un cobro en el proveedor elegido por el ruteo
      description: 'Idempotente por `Idempotency-Key`. `payment_intent_id` ata el cobro al intento. Para `card`, se usa `card_token` (nunca el número); para `qr` la respuesta trae el payload EMVCo MPM; para `bank_transfer`, las instrucciones con una referencia única.'
      parameters:
        - $ref: '#/components/parameters/ServiceId'
        - $ref: '#/components/parameters/Traceparent'
        - $ref: 'common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ChargeCreate' } } }
      responses:
        '201': { description: Cobro creado., content: { application/json: { schema: { $ref: '#/components/schemas/Charge' } } } }
        '200': { description: Ya existía (misma Idempotency-Key)., content: { application/json: { schema: { $ref: '#/components/schemas/Charge' } } } }
        '400': { $ref: 'common.yaml#/components/responses/BadRequest' }
        '403': { $ref: 'common.yaml#/components/responses/Forbidden' }
        '409': { $ref: 'common.yaml#/components/responses/Conflict' }
        '422': { $ref: 'common.yaml#/components/responses/Unprocessable' }
        '502':
          description: '`connector_unavailable`: el proveedor no responde o ningún conector sirve para el medio. No se perdió ni se duplicó nada; el llamador reintenta o consulta el estado.'
          content: { application/problem+json: { schema: { $ref: 'common.yaml#/components/schemas/Problem' } } }
        '500': { $ref: 'common.yaml#/components/responses/ServerError' }
  /charges/{id}:
    get:
      operationId: connectorsGetCharge
      tags: [Charges]
      x-owner: P4
      summary: Consulta un cobro
      parameters:
        - $ref: '#/components/parameters/ServiceId'
        - $ref: '#/components/parameters/Traceparent'
        - $ref: '#/components/parameters/ChargeId'
      responses:
        '200': { description: El cobro., content: { application/json: { schema: { $ref: '#/components/schemas/Charge' } } } }
        '400': { $ref: 'common.yaml#/components/responses/BadRequest' }
        '403': { $ref: 'common.yaml#/components/responses/Forbidden' }
        '404': { $ref: 'common.yaml#/components/responses/NotFound' }
        '500': { $ref: 'common.yaml#/components/responses/ServerError' }
  /charges/{id}/status:
    get:
      operationId: connectorsGetChargeStatus
      tags: [Charges]
      x-owner: P4
      summary: Estado del cobro, consultado al proveedor si hace falta
      description: 'Con `refresh=true` pregunta al proveedor (consulta de estado independiente del callback). Sirve cuando el callback no llegó. Si el proveedor no responde, devuelve el último estado conocido con `stale: true`.'
      parameters:
        - $ref: '#/components/parameters/ServiceId'
        - $ref: '#/components/parameters/Traceparent'
        - $ref: '#/components/parameters/ChargeId'
        - { name: refresh, in: query, schema: { type: boolean, default: false } }
      responses:
        '200': { description: Estado del cobro., content: { application/json: { schema: { $ref: '#/components/schemas/ChargeStatus' } } } }
        '400': { $ref: 'common.yaml#/components/responses/BadRequest' }
        '403': { $ref: 'common.yaml#/components/responses/Forbidden' }
        '404': { $ref: 'common.yaml#/components/responses/NotFound' }
        '500': { $ref: 'common.yaml#/components/responses/ServerError' }
  /charges/{id}/cancel:
    post:
      operationId: connectorsCancelCharge
      tags: [Charges]
      x-owner: P4
      summary: Anula un cobro pendiente (por ejemplo, un QR vencido)
      parameters:
        - $ref: '#/components/parameters/ServiceId'
        - $ref: '#/components/parameters/Traceparent'
        - $ref: '#/components/parameters/ChargeId'
        - $ref: 'common.yaml#/components/parameters/IdempotencyKey'
      responses:
        '200': { description: Cobro anulado., content: { application/json: { schema: { $ref: '#/components/schemas/Charge' } } } }
        '400': { $ref: 'common.yaml#/components/responses/BadRequest' }
        '403': { $ref: 'common.yaml#/components/responses/Forbidden' }
        '404': { $ref: 'common.yaml#/components/responses/NotFound' }
        '409':
          description: '`invalid_state_transition`: el cobro ya se pagó o ya terminó.'
          content: { application/problem+json: { schema: { $ref: 'common.yaml#/components/schemas/Problem' } } }
        '500': { $ref: 'common.yaml#/components/responses/ServerError' }
  /charges/{id}/refunds:
    post:
      operationId: connectorsCreateRefund
      tags: [Charges]
      x-owner: P4
      summary: Reembolsa total o parcialmente un cobro pagado
      parameters:
        - $ref: '#/components/parameters/ServiceId'
        - $ref: '#/components/parameters/Traceparent'
        - $ref: '#/components/parameters/ChargeId'
        - $ref: 'common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount_minor]
              additionalProperties: false
              properties:
                amount_minor: { allOf: [{ $ref: 'common.yaml#/components/schemas/AmountMinor' }, { minimum: 1 }] }
                reason: { type: string, maxLength: 200 }
      responses:
        '201': { description: Reembolso pedido al proveedor., content: { application/json: { schema: { $ref: '#/components/schemas/ConnectorRefund' } } } }
        '400': { $ref: 'common.yaml#/components/responses/BadRequest' }
        '403': { $ref: 'common.yaml#/components/responses/Forbidden' }
        '404': { $ref: 'common.yaml#/components/responses/NotFound' }
        '409': { $ref: 'common.yaml#/components/responses/Conflict' }
        '422': { $ref: 'common.yaml#/components/responses/Unprocessable' }
        '502':
          description: '`connector_unavailable`. Sin efecto: el llamador anula la retención del ledger.'
          content: { application/problem+json: { schema: { $ref: 'common.yaml#/components/schemas/Problem' } } }
        '500': { $ref: 'common.yaml#/components/responses/ServerError' }
  /statements:
    get:
      operationId: connectorsGetStatement
      tags: [Statements]
      x-owner: P4
      summary: Extracto de un conector para conciliar
      description: 'Devuelve las líneas del periodo. Según `Accept`: `application/json` (por defecto), `application/xml` (camt.053) o `text/csv`. El formato en que cada banco entrega el extracto lo fija el banco; este endpoint normaliza a este contrato.'
      x-open-question: 'Falta confirmar con el Banco Mercantil si entrega extractos camt.053, CSV o por API, y qué campo devuelve nuestra referencia (pedidos 7 y siguientes de `docs/spikes/banco-mercantil.md`). Mientras tanto, el conector `mock` los genera.'
      parameters:
        - $ref: '#/components/parameters/ServiceId'
        - $ref: '#/components/parameters/Traceparent'
        - { name: connector, in: query, required: true, schema: { $ref: '#/components/schemas/Connector' } }
        - { name: from, in: query, required: true, schema: { $ref: 'common.yaml#/components/schemas/Timestamp' } }
        - { name: to, in: query, required: true, schema: { $ref: 'common.yaml#/components/schemas/Timestamp' } }
        - $ref: 'common.yaml#/components/parameters/Limit'
        - $ref: 'common.yaml#/components/parameters/StartingAfter'
      responses:
        '200':
          description: Líneas del extracto, de la más nueva a la más vieja.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: 'common.yaml#/components/schemas/ListMeta'
                  - type: object
                    required: [data]
                    properties: { data: { type: array, items: { $ref: '#/components/schemas/StatementLine' } } }
            application/xml: { schema: { type: string, description: Documento ISO 20022 camt.053. } }
            text/csv: { schema: { type: string, description: 'CSV con las mismas columnas que `StatementLine`.' } }
        '400': { $ref: 'common.yaml#/components/responses/BadRequest' }
        '403': { $ref: 'common.yaml#/components/responses/Forbidden' }
        '422': { $ref: 'common.yaml#/components/responses/Unprocessable' }
        '502':
          description: '`connector_unavailable`: no se pudo obtener el extracto.'
          content: { application/problem+json: { schema: { $ref: 'common.yaml#/components/schemas/Problem' } } }
        '500': { $ref: 'common.yaml#/components/responses/ServerError' }
  /callbacks/{connectorId}:
    post:
      operationId: connectorsReceiveCallback
      tags: [Callbacks]
      x-owner: P4
      summary: Recibe la notificación de un proveedor
      description: |
        **Público hacia el proveedor** (sin mTLS). Se autentica con la verificación propia del conector
        (`verifyCallback`: firma o credencial, endpoint registrado, ventana de tiempo).

        - Firma, credencial o endpoint inválidos → **`401` sin efecto**: no se guarda el evento ni se publica nada.
        - Válido → se decide con la máquina de estados qué significa respecto del estado conocido y se responde `200`:
          `applied` (avance legítimo), `duplicate` (reentrega del mismo hecho), `stale` (hecho anterior ya superado,
          por ejemplo `authorized` después de `captured`; se ignora sin retroceder) o `contradiction` (incompatible
          con un estado terminal; no se sobrescribe y queda para conciliación humana).
        - Siempre `200` para estos cuatro, así el proveedor no reintenta eternamente.
      x-open-question: 'El formato del cuerpo y el mecanismo de firma del Banco Mercantil no están publicados (pedido 6 de `docs/spikes/banco-mercantil.md`). El cuerpo se declara libre y lo interpreta el adaptador de cada conector; para `mock` y el contrato de pruebas se firma con Standard Webhooks.'
      security: []
      parameters:
        - { name: connectorId, in: path, required: true, schema: { $ref: '#/components/schemas/Connector' } }
      requestBody:
        required: true
        content:
          application/json: { schema: { type: object, additionalProperties: true, description: Cuerpo definido por el proveedor. } }
          application/xml: { schema: { type: string } }
      responses:
        '200': { description: Notificación aceptada., content: { application/json: { schema: { $ref: '#/components/schemas/CallbackResult' } } } }
        '400': { $ref: 'common.yaml#/components/responses/BadRequest' }
        '401': { $ref: 'common.yaml#/components/responses/Unauthorized' }
        '404': { $ref: 'common.yaml#/components/responses/NotFound' }
        '429': { $ref: 'common.yaml#/components/responses/TooManyRequests' }
        '500': { $ref: 'common.yaml#/components/responses/ServerError' }
  /connectors/health:
    get:
      operationId: connectorsGetHealth
      tags: [Health]
      x-owner: P4
      summary: Salud de cada conector
      description: 'Un conector caído sale del ruteo (REQ-P4-3). Es la misma información que publica el evento `connector.health.changed`.'
      parameters:
        - $ref: '#/components/parameters/ServiceId'
        - $ref: '#/components/parameters/Traceparent'
      responses:
        '200':
          description: Estado por conector.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties: { data: { type: array, items: { $ref: '#/components/schemas/ConnectorHealth' } } }
        '400': { $ref: 'common.yaml#/components/responses/BadRequest' }
        '403': { $ref: 'common.yaml#/components/responses/Forbidden' }
        '500': { $ref: 'common.yaml#/components/responses/ServerError' }
components:
  securitySchemes:
    mTLS:
      type: mutualTLS
      description: Certificado de servicio. La identidad del llamador se confirma además con `X-Service-Id`.
  parameters:
    ServiceId:
      name: X-Service-Id
      in: header
      required: true
      description: Servicio llamador. Tiene que coincidir con la identidad del certificado mTLS.
      schema: { type: string, pattern: '^pay-[a-z]+$', examples: [pay-payments] }
    Traceparent:
      name: traceparent
      in: header
      required: false
      description: W3C Trace Context.
      schema: { type: string, pattern: '^[0-9a-f]{2}-[0-9a-f]{32}-[0-9a-f]{16}-[0-9a-f]{2}$' }
    ChargeId:
      name: id
      in: path
      required: true
      schema: { type: string, pattern: '^ch_[a-z0-9]{10,40}$' }
  schemas:
    Connector:
      type: string
      enum: [mock, mercantil_qr, mercantil_card, bank_transfer]
    Mode:
      type: string
      enum: [sandbox, live]
      description: '`sandbox` nunca mueve dinero real.'
    Method:
      type: string
      enum: [qr, card, bank_transfer]
    ChargeStatus:
      type: object
      required: [charge_id, status, connector, mode, checked_at]
      properties:
        charge_id: { type: string, pattern: '^ch_[a-z0-9]{10,40}$' }
        status: { type: string, enum: [pending, requires_action, succeeded, failed, expired, canceled] }
        connector: { $ref: '#/components/schemas/Connector' }
        mode: { $ref: '#/components/schemas/Mode' }
        failure_code: { type: [string, 'null'], description: 'Código estable ya mapeado del proveedor (por ejemplo `card_declined`). El mensaje crudo del proveedor no sale de este servicio.' }
        stale: { type: boolean, description: '`true` si no se pudo consultar al proveedor y se devuelve el último estado conocido.' }
        checked_at: { $ref: 'common.yaml#/components/schemas/Timestamp' }
    ChargeCreate:
      type: object
      required: [payment_intent_id, merchant_id, amount_minor, currency, method, expires_at]
      additionalProperties: false
      properties:
        payment_intent_id: { type: string, pattern: '^pi_[a-z0-9]{10,40}$' }
        merchant_id: { type: string, pattern: '^mc_[a-z0-9]{10,40}$' }
        amount_minor: { allOf: [{ $ref: 'common.yaml#/components/schemas/AmountMinor' }, { minimum: 1 }] }
        currency: { $ref: 'common.yaml#/components/schemas/Currency' }
        method: { $ref: '#/components/schemas/Method' }
        preferred_connector: { $ref: '#/components/schemas/Connector' }
        card_token: { type: string, pattern: '^tok_[a-z0-9]{10,60}$', description: 'Solo para `card`. Token de `pay-vault` o del banco; nunca el número.' }
        expires_at: { $ref: 'common.yaml#/components/schemas/Timestamp' }
        description: { type: string, maxLength: 200 }
    Charge:
      type: object
      required: [id, object, payment_intent_id, connector, mode, method, amount_minor, currency, status, created_at]
      properties:
        id: { type: string, pattern: '^ch_[a-z0-9]{10,40}$' }
        object: { const: charge }
        payment_intent_id: { type: string, pattern: '^pi_[a-z0-9]{10,40}$' }
        connector: { $ref: '#/components/schemas/Connector' }
        mode: { $ref: '#/components/schemas/Mode' }
        method: { $ref: '#/components/schemas/Method' }
        amount_minor: { $ref: 'common.yaml#/components/schemas/AmountMinor' }
        currency: { $ref: 'common.yaml#/components/schemas/Currency' }
        status: { type: string, enum: [pending, requires_action, succeeded, failed, expired, canceled] }
        next_action: { $ref: '#/components/schemas/ChargeNextAction' }
        provider_reference: { type: [string, 'null'], description: 'Referencia del proveedor, opaca. Nula hasta que el proveedor la asigna.' }
        failure_code: { type: [string, 'null'] }
        created_at: { $ref: 'common.yaml#/components/schemas/Timestamp' }
        expires_at: { $ref: 'common.yaml#/components/schemas/Timestamp' }
    ChargeNextAction:
      description: Qué tiene que hacer el pagador. Ausente si no hay nada pendiente.
      oneOf:
        - type: object
          required: [type, payload]
          properties:
            type: { const: display_qr }
            payload: { type: string, description: 'Cadena EMVCo MPM generada por `pay-qr` (empieza con 000201, termina con 6304 + CRC16).' }
            expires_at: { $ref: 'common.yaml#/components/schemas/Timestamp' }
        - type: object
          required: [type, reference]
          properties:
            type: { const: bank_transfer_instructions }
            reference: { type: string, description: 'Referencia única que el pagador debe poner; con ella se concilia.' }
        - type: object
          required: [type, url]
          properties:
            type: { const: redirect_to_card_form }
            url: { type: string, format: uri }
    ConnectorRefund:
      type: object
      required: [id, object, charge_id, amount_minor, currency, status, created_at]
      properties:
        id: { type: string, pattern: '^cr_[a-z0-9]{10,40}$' }
        object: { const: connector_refund }
        charge_id: { type: string, pattern: '^ch_[a-z0-9]{10,40}$' }
        amount_minor: { $ref: 'common.yaml#/components/schemas/AmountMinor' }
        currency: { $ref: 'common.yaml#/components/schemas/Currency' }
        status: { type: string, enum: [pending, succeeded, failed] }
        failure_code: { type: [string, 'null'] }
        created_at: { $ref: 'common.yaml#/components/schemas/Timestamp' }
    StatementLine:
      type: object
      required: [provider_reference, direction, amount_minor, currency, value_date]
      properties:
        provider_reference: { type: string, description: 'Referencia del proveedor o del banco para esta línea.' }
        our_reference: { type: [string, 'null'], description: 'Nuestra referencia (por ejemplo, la de la transferencia) si el banco la devuelve. Nula si no.' }
        charge_id: { type: [string, 'null'], pattern: '^ch_[a-z0-9]{10,40}$', description: 'Cobro con el que se emparejó la línea, si se pudo.' }
        direction: { type: string, enum: [credit, debit] }
        amount_minor: { $ref: 'common.yaml#/components/schemas/AmountMinor' }
        currency: { $ref: 'common.yaml#/components/schemas/Currency' }
        value_date: { type: string, format: date }
        booked_at: { $ref: 'common.yaml#/components/schemas/Timestamp' }
        description: { type: [string, 'null'], maxLength: 140, description: 'Glosa del banco. Se descarta si trae datos personales.' }
    CallbackResult:
      type: object
      required: [result]
      properties:
        result: { type: string, enum: [applied, duplicate, stale, contradiction] }
        charge_id: { type: [string, 'null'], pattern: '^ch_[a-z0-9]{10,40}$' }
    ConnectorHealth:
      type: object
      required: [connector, mode, status, checked_at]
      properties:
        connector: { $ref: '#/components/schemas/Connector' }
        mode: { $ref: '#/components/schemas/Mode' }
        status: { type: string, enum: [up, degraded, down] }
        latency_ms: { type: [integer, 'null'], minimum: 0 }
        checked_at: { $ref: 'common.yaml#/components/schemas/Timestamp' }
