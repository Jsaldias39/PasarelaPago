# Contrato INTERNO de pay-settlement. BORRADOR de la ola 0 (`v1-draft`): no está congelado.
openapi: 3.1.0
info:
  title: pay-settlement — API interna v1
  version: 1.0.0-draft
  description: |
    Corte de liquidación, pagos a comercios (payouts) y conciliación.

    - **Expone:** P2 (`pay-settlement`).
    - **Consume:** `pay-schedules` (P5) para pagar comisiones y obligaciones programadas (procesos 7.7 y 7.8);
      el job de corte y los operadores de conciliación (consola interna, fuera de este plan).
    - **Habla con:** `pay-ledger` (retenciones y asientos) y `pay-connectors` (extractos). Nunca guarda saldos.
    - **Seguridad:** mTLS + `X-Service-Id`.

    ## Quién llama a qué (supuesto de la ola 1, P2-D6: a confirmar con el dueño)

    | `X-Service-Id` | Operaciones |
    |---|---|
    | `pay-schedules` | `POST /payouts`, `GET /payouts`, `GET /payouts/{id}`, `POST /charges` |
    | `pay-payments` | `POST /charges` (deuda por contracargo, D-22) |
    | `pay-edge` | `GET /payouts` (la forma pública, ver abajo) |
    | `pay-backoffice` (consola interna de operación, fuera de este plan; nombre fijado por D-31, antes provisorio `pay-console`) | todas, y es la única que corre cortes (`/batches`), concilia (`/reconciliation_*`) y exporta (`/exports/accounting`) |

    Todo otro servicio recibe `403 forbidden`. (`pay-merchants` llama `pay-backoffice` a su equivalente: el nombre definitivo del
    back-office es una decisión pendiente del dueño.)

    ## `GET /payouts` tiene dos formas

    `public-v1.yaml` también define `GET /payouts`. Es UNA sola ruta de este servicio con dos públicos: cuando llama `pay-edge`
    devuelve la forma pública (`Payout` de `public-v1.yaml`), acotada al comercio de `X-Merchant-Id`, y solo admite `limit` y
    `starting_after` (`merchant_id` y `status` no existen en la consulta pública: `422`); cuando llama un servicio interno devuelve el
    `Payout` completo de este contrato y puede filtrar por `merchant_id` y `status`.

    ## Credenciales y errores

    Un servicio mal identificado es `403 forbidden`. Una operación que exige la credencial de una persona (`OperatorToken`) responde
    `401 unauthorized` si la credencial falta, venció o no se puede verificar, y `403 forbidden` si es válida pero no tiene el rol; el
    servicio no dice por qué falló la verificación. Todo cuerpo o parámetro inválido es `422 validation_failed` con un error por
    campo; `400` queda para `idempotency_key_required` y `bad_request` (una petición ilegible).

    Si `pay-ledger` no responde, la operación devuelve `503 ledger_unavailable` y no deja nada a medias: la MISMA `Idempotency-Key` la
    retoma donde estaba.

    ## Modo (D-28)

    `X-Pay-Mode: test|live` (parámetro `PayMode` de `common.yaml`) llega de `pay-edge` y se propaga al ledger y a los conectores. La
    obligatoriedad y el filtro por `(comercio, modo)` son de la ola 2.

    ## Corte semanal (D-08, D-19)

    El corte corre **los lunes**. Libera a `available` lo cobrado hasta **7 días antes** (T+7) y crea un payout por
    comercio con saldo. Es idempotente por `cutoff_date`: correrlo dos veces el mismo lunes no paga dos veces.

    ## Rieles de pago (`rail`)

    - `bank_transfer`: transferencia desde la cuenta recaudadora (modo A, D-02). Es el riel real.
    - `acquirer_settlement`: liquidación como adquirente (modo B). **Es un doble declarado**: D-02 eligió el
      modo A. Responde igual que el real, pero no mueve dinero y se marca `simulated: true`.

    ## Conciliación

    Cruza el extracto del banco (`pay-connectors`) con el ledger. Una diferencia **no ajusta el ledger sola**:
    queda como excepción para que una persona la resuelva (REQ-P2-6).
servers:
  - url: http://pay-settlement:3000
    description: Marcador de la red interna.
security:
  - mTLS: []
tags:
  - { name: Payouts, description: Pagos a comercios }
  - { name: Batches, description: Corte de liquidación }
  - { name: Reconciliation, description: Conciliación y excepciones }
  - { name: Charges, description: 'Cobros a comercios que se netean contra su saldo (7.8, D-22)' }
  - { name: Exports, description: Exportación para contabilidad }
paths:
  /payouts:
    post:
      operationId: settlementCreatePayout
      tags: [Payouts]
      x-owner: P2
      summary: Paga un monto disponible a un comercio
      description: 'Retiene el monto en `merchant:{id}:available`, ordena el pago por el riel y confirma (`post`) o anula (`void`) la retención según el resultado. Un monto mayor al disponible da `422 insufficient_funds` sin efecto.'
      parameters:
        - $ref: '#/components/parameters/ServiceId'
        - $ref: '#/components/parameters/Traceparent'
        - $ref: 'common.yaml#/components/parameters/PayMode'
        - $ref: 'common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/PayoutCreate' } } }
      responses:
        '201': { description: Payout creado., content: { application/json: { schema: { $ref: '#/components/schemas/Payout' } } } }
        '400': { $ref: 'common.yaml#/components/responses/BadRequest' }
        '403': { $ref: 'common.yaml#/components/responses/Forbidden' }
        '409': { $ref: 'common.yaml#/components/responses/Conflict' }
        '422': { $ref: 'common.yaml#/components/responses/Unprocessable' }
        '500': { $ref: 'common.yaml#/components/responses/ServerError' }
        '503':
          description: '`ledger_unavailable`: el ledger no respondió. No quedó nada a medias; la MISMA `Idempotency-Key` retoma la operación donde estaba.'
          content: { application/problem+json: { schema: { $ref: 'common.yaml#/components/schemas/Problem' } } }
    get:
      operationId: settlementListPayouts
      tags: [Payouts]
      x-owner: P2
      summary: Lista payouts
      parameters:
        - $ref: '#/components/parameters/ServiceId'
        - $ref: '#/components/parameters/Traceparent'
        - $ref: 'common.yaml#/components/parameters/PayMode'
        - $ref: 'common.yaml#/components/parameters/Limit'
        - $ref: 'common.yaml#/components/parameters/StartingAfter'
        - { name: merchant_id, in: query, schema: { $ref: '#/components/schemas/MerchantId' } }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/PayoutStatus' } }
      responses:
        '200':
          description: Página de payouts, del más nuevo al más viejo.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: 'common.yaml#/components/schemas/ListMeta'
                  - type: object
                    required: [data]
                    properties: { data: { type: array, items: { $ref: '#/components/schemas/Payout' } } }
        '400': { $ref: 'common.yaml#/components/responses/BadRequest' }
        '403': { $ref: 'common.yaml#/components/responses/Forbidden' }
        '422': { $ref: 'common.yaml#/components/responses/Unprocessable' }
        '500': { $ref: 'common.yaml#/components/responses/ServerError' }
        '503':
          description: '`ledger_unavailable`: el ledger no respondió. Es una lectura: se reintenta.'
          content: { application/problem+json: { schema: { $ref: 'common.yaml#/components/schemas/Problem' } } }
  /payouts/{id}:
    get:
      operationId: settlementGetPayout
      tags: [Payouts]
      x-owner: P2
      summary: Consulta un payout
      parameters:
        - $ref: '#/components/parameters/ServiceId'
        - $ref: '#/components/parameters/Traceparent'
        - $ref: 'common.yaml#/components/parameters/PayMode'
        - { name: id, in: path, required: true, schema: { type: string, pattern: '^po_[a-z0-9]{10,40}$' } }
      responses:
        '200': { description: El payout., content: { application/json: { schema: { $ref: '#/components/schemas/Payout' } } } }
        '400': { $ref: 'common.yaml#/components/responses/BadRequest' }
        '403': { $ref: 'common.yaml#/components/responses/Forbidden' }
        '404': { $ref: 'common.yaml#/components/responses/NotFound' }
        '422': { $ref: 'common.yaml#/components/responses/Unprocessable' }
        '500': { $ref: 'common.yaml#/components/responses/ServerError' }
        '503':
          description: '`ledger_unavailable`: el ledger no respondió. Es una lectura: se reintenta.'
          content: { application/problem+json: { schema: { $ref: 'common.yaml#/components/schemas/Problem' } } }
  /batches:
    post:
      operationId: settlementRunBatch
      tags: [Batches]
      x-owner: P2
      summary: Corre el corte de liquidación
      description: 'Libera a `available` lo cobrado hasta `release_before` y crea un payout por comercio con saldo. Idempotente por `cutoff_date`: repetirlo devuelve el mismo lote.'
      parameters:
        - $ref: '#/components/parameters/ServiceId'
        - $ref: '#/components/parameters/Traceparent'
        - $ref: 'common.yaml#/components/parameters/PayMode'
        - $ref: 'common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/BatchCreate' } } }
      responses:
        '201': { description: Lote creado y en ejecución., content: { application/json: { schema: { $ref: '#/components/schemas/Batch' } } } }
        '200': { description: 'Ya existía el lote de ese `cutoff_date`.', content: { application/json: { schema: { $ref: '#/components/schemas/Batch' } } } }
        '400': { $ref: 'common.yaml#/components/responses/BadRequest' }
        '403': { $ref: 'common.yaml#/components/responses/Forbidden' }
        '422': { $ref: 'common.yaml#/components/responses/Unprocessable' }
        '500': { $ref: 'common.yaml#/components/responses/ServerError' }
        '503':
          description: '`ledger_unavailable`: el ledger no respondió. No quedó nada a medias; la MISMA `Idempotency-Key` retoma la operación donde estaba.'
          content: { application/problem+json: { schema: { $ref: 'common.yaml#/components/schemas/Problem' } } }
    get:
      operationId: settlementListBatches
      tags: [Batches]
      x-owner: P2
      summary: Lista los lotes de liquidación
      parameters:
        - $ref: '#/components/parameters/ServiceId'
        - $ref: '#/components/parameters/Traceparent'
        - $ref: 'common.yaml#/components/parameters/PayMode'
        - $ref: 'common.yaml#/components/parameters/Limit'
        - $ref: 'common.yaml#/components/parameters/StartingAfter'
      responses:
        '200':
          description: Página de lotes, del más nuevo al más viejo.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: 'common.yaml#/components/schemas/ListMeta'
                  - type: object
                    required: [data]
                    properties: { data: { type: array, items: { $ref: '#/components/schemas/Batch' } } }
        '400': { $ref: 'common.yaml#/components/responses/BadRequest' }
        '403': { $ref: 'common.yaml#/components/responses/Forbidden' }
        '422': { $ref: 'common.yaml#/components/responses/Unprocessable' }
        '500': { $ref: 'common.yaml#/components/responses/ServerError' }
        '503':
          description: '`ledger_unavailable`: el ledger no respondió. Es una lectura: se reintenta.'
          content: { application/problem+json: { schema: { $ref: 'common.yaml#/components/schemas/Problem' } } }
  /reconciliation_runs:
    post:
      operationId: settlementCreateReconciliationRun
      tags: [Reconciliation]
      x-owner: P2
      summary: Concilia el extracto de un conector contra el ledger
      description: 'Pide el extracto a `pay-connectors`, lo cruza con el ledger y registra las diferencias como excepciones. No modifica el ledger.'
      parameters:
        - $ref: '#/components/parameters/ServiceId'
        - $ref: '#/components/parameters/Traceparent'
        - $ref: 'common.yaml#/components/parameters/PayMode'
        - $ref: 'common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ReconciliationRunCreate' } } }
      responses:
        '202': { description: Corrida aceptada; se consulta por su id., content: { application/json: { schema: { $ref: '#/components/schemas/ReconciliationRun' } } } }
        '400': { $ref: 'common.yaml#/components/responses/BadRequest' }
        '403': { $ref: 'common.yaml#/components/responses/Forbidden' }
        '422': { $ref: 'common.yaml#/components/responses/Unprocessable' }
        '500': { $ref: 'common.yaml#/components/responses/ServerError' }
        '503':
          description: '`ledger_unavailable`: el ledger no respondió. No quedó nada a medias; la MISMA `Idempotency-Key` retoma la operación donde estaba.'
          content: { application/problem+json: { schema: { $ref: 'common.yaml#/components/schemas/Problem' } } }
  /reconciliation_runs/{id}:
    get:
      operationId: settlementGetReconciliationRun
      tags: [Reconciliation]
      x-owner: P2
      summary: Estado de una corrida de conciliación
      parameters:
        - $ref: '#/components/parameters/ServiceId'
        - $ref: '#/components/parameters/Traceparent'
        - $ref: 'common.yaml#/components/parameters/PayMode'
        - { name: id, in: path, required: true, schema: { type: string, pattern: '^rr_[a-z0-9]{10,40}$' } }
      responses:
        '200': { description: La corrida., content: { application/json: { schema: { $ref: '#/components/schemas/ReconciliationRun' } } } }
        '400': { $ref: 'common.yaml#/components/responses/BadRequest' }
        '403': { $ref: 'common.yaml#/components/responses/Forbidden' }
        '404': { $ref: 'common.yaml#/components/responses/NotFound' }
        '422': { $ref: 'common.yaml#/components/responses/Unprocessable' }
        '500': { $ref: 'common.yaml#/components/responses/ServerError' }
        '503':
          description: '`ledger_unavailable`: el ledger no respondió. Es una lectura: se reintenta.'
          content: { application/problem+json: { schema: { $ref: 'common.yaml#/components/schemas/Problem' } } }
  /reconciliation_exceptions:
    get:
      operationId: settlementListReconciliationExceptions
      tags: [Reconciliation]
      x-owner: P2
      summary: Lista las excepciones de conciliación
      parameters:
        - $ref: '#/components/parameters/ServiceId'
        - $ref: '#/components/parameters/Traceparent'
        - $ref: 'common.yaml#/components/parameters/PayMode'
        - $ref: 'common.yaml#/components/parameters/Limit'
        - $ref: 'common.yaml#/components/parameters/StartingAfter'
        - { name: status, in: query, schema: { type: string, enum: [open, resolved, dismissed] } }
      responses:
        '200':
          description: Página de excepciones, de la más nueva a la más vieja.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: 'common.yaml#/components/schemas/ListMeta'
                  - type: object
                    required: [data]
                    properties: { data: { type: array, items: { $ref: '#/components/schemas/ReconciliationException' } } }
        '400': { $ref: 'common.yaml#/components/responses/BadRequest' }
        '403': { $ref: 'common.yaml#/components/responses/Forbidden' }
        '422': { $ref: 'common.yaml#/components/responses/Unprocessable' }
        '500': { $ref: 'common.yaml#/components/responses/ServerError' }
        '503':
          description: '`ledger_unavailable`: el ledger no respondió. Es una lectura: se reintenta.'
          content: { application/problem+json: { schema: { $ref: 'common.yaml#/components/schemas/Problem' } } }
  /reconciliation_exceptions/{id}/resolve:
    post:
      operationId: settlementResolveReconciliationException
      tags: [Reconciliation]
      x-owner: P2
      summary: Cierra una excepción con la decisión de una persona
      description: >-
        Registra quién decidió y por qué. **Quién decide sale de la credencial del operador, nunca del cuerpo**: el servicio
        verifica un token de operador (`OperatorToken`), toma su `sub` como `resolved_by` y exige el rol `settlement_operator`
        para `dismiss` y `settlement_admin` para `request_adjustment`; la decisión queda en la auditoría. `request_adjustment`
        NO ajusta el ledger: solicita el asiento de ajuste por el flujo normal (`code: adjustment`) con su propia aprobación.
      x-open-question: 'Quién puede aprobar un ajuste y con qué tope no lo define el stakeholder. Confirmar con el dueño y contabilidad antes de congelar. Los roles `settlement_operator` y `settlement_admin` tampoco existen todavía en el servicio de identidad (Q-21).'
      security:
        - mTLS: []
          OperatorToken: []
      parameters:
        - $ref: '#/components/parameters/ServiceId'
        - $ref: '#/components/parameters/Traceparent'
        - $ref: 'common.yaml#/components/parameters/PayMode'
        - { name: id, in: path, required: true, schema: { type: string, pattern: '^rx_[a-z0-9]{10,40}$' } }
        - $ref: 'common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ReconciliationExceptionResolve' } } }
      responses:
        '200': { description: Excepción cerrada., content: { application/json: { schema: { $ref: '#/components/schemas/ReconciliationException' } } } }
        '400': { $ref: 'common.yaml#/components/responses/BadRequest' }
        '401': { $ref: 'common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: 'common.yaml#/components/responses/Forbidden' }
        '404': { $ref: 'common.yaml#/components/responses/NotFound' }
        '409': { $ref: 'common.yaml#/components/responses/Conflict' }
        '422': { $ref: 'common.yaml#/components/responses/Unprocessable' }
        '500': { $ref: 'common.yaml#/components/responses/ServerError' }
        '503':
          description: '`ledger_unavailable`: el ledger no respondió. No quedó nada a medias; la MISMA `Idempotency-Key` retoma la operación donde estaba.'
          content: { application/problem+json: { schema: { $ref: 'common.yaml#/components/schemas/Problem' } } }
  /charges:
    post:
      operationId: settlementCreateCharge
      tags: [Charges]
      x-owner: P2
      summary: Registra un cobro a un comercio que se netea contra su saldo
      description: |
        Dos usos: la comisión programada de un proveedor hacia ALOVIDA (`provider_commission`, proceso 7.8) y la deuda por un contracargo
        perdido (`chargeback_debt`, D-22; exige `connector`, el conector al que se le devuelve el dinero). El monto se cobra del saldo
        `available` del comercio hasta donde alcance; lo que falta queda **abierto** (`debt_minor`) y se netea en el próximo corte
        (P2-D9). Sin interés ni recargo. Idempotente por `(comercio, kind, reference)` y por `Idempotency-Key`: repetir el cobro con otro
        monto es `409 invalid_state_transition`. El abono mensual (`monthly_fee`) lo crea el corte, no esta operación.
      parameters:
        - $ref: '#/components/parameters/ServiceId'
        - $ref: '#/components/parameters/Traceparent'
        - $ref: 'common.yaml#/components/parameters/PayMode'
        - $ref: 'common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ChargeCreate' } } }
      responses:
        '201': { description: 'Cobro registrado (también al repetir la misma `Idempotency-Key`, con `Idempotency-Replayed: true`).', content: { application/json: { schema: { $ref: '#/components/schemas/SettlementCharge' } } } }
        '400': { $ref: 'common.yaml#/components/responses/BadRequest' }
        '403': { $ref: 'common.yaml#/components/responses/Forbidden' }
        '409': { $ref: 'common.yaml#/components/responses/Conflict' }
        '422': { $ref: 'common.yaml#/components/responses/Unprocessable' }
        '500': { $ref: 'common.yaml#/components/responses/ServerError' }
        '503':
          description: '`ledger_unavailable`: el ledger no respondió. No quedó nada a medias; la MISMA `Idempotency-Key` retoma la operación.'
          content: { application/problem+json: { schema: { $ref: 'common.yaml#/components/schemas/Problem' } } }
  /exports/accounting:
    get:
      operationId: settlementExportAccounting
      tags: [Exports]
      x-owner: P2
      summary: Exporta los asientos de un periodo cerrado para contabilidad (M16)
      description: |
        Una factura por periodo y por comercio (D-21). Se arma solo con lo que el ledger y este servicio saben: por comercio, cada cobro
        (bruto = neto + comisión) y cada abono, comisión programada o contracargo cobrado. `balanced` es `true` cuando la suma de comisiones
        exportadas es igual al neto real de `platform:fees` en el periodo y ninguna comisión quedó sin comercio; si no cuadra se devuelve
        igual, con la diferencia a la vista (no se maquilla). `409 invalid_state_transition` si el periodo todavía no cerró o hay cortes
        del periodo sin completar. `format=csv` devuelve una fila por línea.
      x-open-question: 'El formato exacto (JSON o CSV, columnas) lo tiene que confirmar M16 (contabilidad del monolito). Lo descrito es lo que el servicio entrega hoy.'
      parameters:
        - $ref: '#/components/parameters/ServiceId'
        - $ref: '#/components/parameters/Traceparent'
        - $ref: 'common.yaml#/components/parameters/PayMode'
        - { name: period_from, in: query, required: true, schema: { $ref: 'common.yaml#/components/schemas/Timestamp' } }
        - { name: period_to, in: query, required: true, schema: { $ref: 'common.yaml#/components/schemas/Timestamp' } }
        - { name: format, in: query, schema: { type: string, enum: [json, csv], default: json } }
      responses:
        '200':
          description: La exportación.
          content:
            application/json: { schema: { $ref: '#/components/schemas/AccountingExport' } }
            text/csv: { schema: { type: string, description: 'Cabecera `merchant_id,kind,reference,gross_minor,fee_minor,net_minor,currency` y una fila por línea.' } }
        '400': { $ref: 'common.yaml#/components/responses/BadRequest' }
        '403': { $ref: 'common.yaml#/components/responses/Forbidden' }
        '409': { $ref: 'common.yaml#/components/responses/Conflict' }
        '422': { $ref: 'common.yaml#/components/responses/Unprocessable' }
        '500': { $ref: 'common.yaml#/components/responses/ServerError' }
        '503':
          description: '`ledger_unavailable`: el ledger no respondió. Es una lectura: se reintenta.'
          content: { application/problem+json: { schema: { $ref: 'common.yaml#/components/schemas/Problem' } } }
components:
  securitySchemes:
    mTLS:
      type: mutualTLS
      description: Certificado de servicio. La identidad del llamador se confirma además con `X-Service-Id`.
    OperatorToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Credencial de la persona operadora (emitida por el servicio de identidad de ALOVIDA y verificada por `pay-settlement`). De ahí salen la identidad (`sub`) y el rol de quien resuelve; nunca del cuerpo de la petición.
  parameters:
    ServiceId:
      name: X-Service-Id
      in: header
      required: true
      description: Servicio llamador. Tiene que coincidir con la identidad del certificado mTLS.
      schema: { type: string, pattern: '^pay-[a-z]+$', examples: [pay-schedules] }
    Traceparent:
      name: traceparent
      in: header
      required: false
      description: W3C Trace Context.
      schema: { type: string, pattern: '^[0-9a-f]{2}-[0-9a-f]{32}-[0-9a-f]{16}-[0-9a-f]{2}$' }
  schemas:
    MerchantId:
      type: string
      pattern: '^mc_[a-z0-9]{10,40}$'
    Rail:
      type: string
      enum: [bank_transfer, acquirer_settlement]
      description: '`acquirer_settlement` es un doble declarado (modo B, D-02): no mueve dinero.'
    PayoutStatus:
      type: string
      enum: [pending, in_transit, paid, failed]
    PayoutCreate:
      type: object
      required: [merchant_id, amount_minor, currency, rail]
      additionalProperties: false
      properties:
        merchant_id: { $ref: '#/components/schemas/MerchantId' }
        amount_minor: { allOf: [{ $ref: 'common.yaml#/components/schemas/AmountMinor' }, { minimum: 1 }] }
        currency: { $ref: 'common.yaml#/components/schemas/Currency' }
        rail: { $ref: '#/components/schemas/Rail' }
        reason:
          type: string
          enum: [weekly_cut, mandate_obligation, mandate_commission, manual]
          description: 'Origen del pago. `manual` queda auditado con el llamador.'
        batch_id: { type: string, pattern: '^sb_[a-z0-9]{10,40}$' }
    Payout:
      type: object
      required: [id, object, merchant_id, amount_minor, currency, rail, simulated, status, created_at]
      properties:
        id: { type: string, pattern: '^po_[a-z0-9]{10,40}$' }
        object: { const: payout }
        merchant_id: { $ref: '#/components/schemas/MerchantId' }
        amount_minor: { $ref: 'common.yaml#/components/schemas/AmountMinor' }
        currency: { $ref: 'common.yaml#/components/schemas/Currency' }
        rail: { $ref: '#/components/schemas/Rail' }
        simulated: { type: boolean, description: '`true` si el riel es un doble y no movió dinero real.' }
        status: { $ref: '#/components/schemas/PayoutStatus' }
        hold_id: { type: [string, 'null'], pattern: '^hd_[a-z0-9]{10,40}$', description: 'Retención del ledger que respalda el pago.' }
        batch_id: { type: [string, 'null'] }
        failure_code: { type: [string, 'null'], description: 'Presente cuando `status` es `failed`: `insufficient_funds`, `connector_unavailable`, `ledger_unavailable`, `rail_rejected` (el riel rechazó el pago de forma definitiva) o `internal_error`.' }
        created_at: { $ref: 'common.yaml#/components/schemas/Timestamp' }
        paid_at: { oneOf: [{ $ref: 'common.yaml#/components/schemas/Timestamp' }, { type: 'null' }] }
    BatchCreate:
      type: object
      required: [cutoff_date]
      additionalProperties: false
      properties:
        cutoff_date: { type: string, format: date, description: 'Fecha del corte (un lunes en la política vigente, D-19). Clave de idempotencia del lote.' }
        release_days: { type: integer, minimum: 0, maximum: 60, default: 7, description: 'Desfase T+N. Por defecto 7 (D-19).' }
    Batch:
      type: object
      required: [id, object, cutoff_date, release_before, status, created_at]
      properties:
        id: { type: string, pattern: '^sb_[a-z0-9]{10,40}$' }
        object: { const: settlement_batch }
        cutoff_date: { type: string, format: date }
        release_before: { $ref: 'common.yaml#/components/schemas/Timestamp' }
        status: { type: string, enum: [running, completed, failed] }
        merchants_count: { type: integer, minimum: 0 }
        released_minor: { $ref: 'common.yaml#/components/schemas/AmountMinor' }
        payouts_count: { type: integer, minimum: 0 }
        created_at: { $ref: 'common.yaml#/components/schemas/Timestamp' }
        completed_at: { oneOf: [{ $ref: 'common.yaml#/components/schemas/Timestamp' }, { type: 'null' }] }
    ReconciliationRunCreate:
      type: object
      required: [connector, period_from, period_to]
      additionalProperties: false
      properties:
        connector: { type: string, enum: [mock, mercantil_qr, mercantil_card, bank_transfer] }
        period_from: { $ref: 'common.yaml#/components/schemas/Timestamp' }
        period_to: { $ref: 'common.yaml#/components/schemas/Timestamp' }
    ReconciliationRun:
      type: object
      required: [id, object, connector, period_from, period_to, status, created_at]
      properties:
        id: { type: string, pattern: '^rr_[a-z0-9]{10,40}$' }
        object: { const: reconciliation_run }
        connector: { type: string }
        period_from: { $ref: 'common.yaml#/components/schemas/Timestamp' }
        period_to: { $ref: 'common.yaml#/components/schemas/Timestamp' }
        status: { type: string, enum: [running, completed, failed] }
        matched_count: { type: integer, minimum: 0 }
        exception_count: { type: integer, minimum: 0 }
        failure_code: { type: [string, 'null'], description: 'Por ejemplo `statement_malformed`: el extracto no se pudo leer y no se asentó nada.' }
        created_at: { $ref: 'common.yaml#/components/schemas/Timestamp' }
        completed_at: { oneOf: [{ $ref: 'common.yaml#/components/schemas/Timestamp' }, { type: 'null' }] }
    ReconciliationException:
      type: object
      required: [id, object, run_id, kind, status, created_at]
      properties:
        id: { type: string, pattern: '^rx_[a-z0-9]{10,40}$' }
        object: { const: reconciliation_exception }
        run_id: { type: string, pattern: '^rr_[a-z0-9]{10,40}$' }
        kind:
          type: string
          enum: [missing_in_ledger, missing_in_statement, amount_mismatch, duplicate_in_statement, unknown_reference]
        provider_reference: { type: [string, 'null'] }
        business_ref: { type: [string, 'null'] }
        statement_amount_minor: { oneOf: [{ $ref: 'common.yaml#/components/schemas/AmountMinor' }, { type: 'null' }] }
        ledger_amount_minor: { oneOf: [{ $ref: 'common.yaml#/components/schemas/AmountMinor' }, { type: 'null' }] }
        status: { type: string, enum: [open, resolved, dismissed] }
        resolved_by: { type: [string, 'null'], readOnly: true, description: 'Identificador de la persona que decidió (el `sub` de su credencial; no su nombre). Solo lectura: lo fija el servidor.' }
        resolution_note: { type: [string, 'null'], maxLength: 500 }
        created_at: { $ref: 'common.yaml#/components/schemas/Timestamp' }
    ReconciliationExceptionResolve:
      type: object
      required: [resolution, note]
      additionalProperties: false
      properties:
        resolution: { type: string, enum: [request_adjustment, dismiss], description: '`dismiss` = falsa alarma; `request_adjustment` = pide un asiento de ajuste por el flujo normal.' }
        note: { type: string, minLength: 1, maxLength: 500, description: 'Motivo. Sin datos personales.' }
    ChargeCreate:
      type: object
      required: [merchant_id, kind, reference, amount_minor, currency]
      additionalProperties: false
      properties:
        merchant_id: { $ref: '#/components/schemas/MerchantId' }
        kind: { type: string, enum: [provider_commission, chargeback_debt] }
        reference: { type: string, pattern: '^[A-Za-z0-9_.:-]{3,80}$', description: 'Referencia estable del cobro, definida por el llamador (por ejemplo `md_x:2026-11`). Junto con el comercio y `kind` identifica el cobro.' }
        amount_minor: { allOf: [{ $ref: 'common.yaml#/components/schemas/AmountMinor' }, { minimum: 1 }] }
        currency: { $ref: 'common.yaml#/components/schemas/Currency' }
        connector: { type: string, pattern: '^[a-z_]{3,30}$', description: 'Conector al que se le devuelve el contracargo. Obligatorio para `chargeback_debt` y prohibido para `provider_commission`.' }
    SettlementCharge:
      type: object
      required: [id, object, merchant_id, kind, reference, amount_minor, collected_minor, debt_minor, currency, status, created_at]
      properties:
        id: { type: string, pattern: '^cg_[a-z0-9]{10,40}$' }
        object: { const: settlement_charge }
        merchant_id: { $ref: '#/components/schemas/MerchantId' }
        kind: { type: string, enum: [monthly_fee, provider_commission, chargeback_debt] }
        reference: { type: string }
        amount_minor: { $ref: 'common.yaml#/components/schemas/AmountMinor' }
        collected_minor: { $ref: 'common.yaml#/components/schemas/AmountMinor' }
        debt_minor: { $ref: 'common.yaml#/components/schemas/AmountMinor' }
        currency: { $ref: 'common.yaml#/components/schemas/Currency' }
        status: { type: string, enum: [open, collected], description: '`collected` cuando `collected_minor` iguala a `amount_minor`.' }
        created_at: { $ref: 'common.yaml#/components/schemas/Timestamp' }
        collected_at: { oneOf: [{ $ref: 'common.yaml#/components/schemas/Timestamp' }, { type: 'null' }] }
    AccountingExportLine:
      type: object
      required: [kind, reference, gross_minor, fee_minor, net_minor]
      properties:
        kind: { type: string, enum: [charge, refund, monthly_fee, provider_commission, chargeback_debt] }
        reference: { type: string, description: 'Referencia opaca; nunca lleva datos personales.' }
        gross_minor: { type: integer }
        fee_minor: { type: integer }
        net_minor: { type: integer }
    AccountingExport:
      type: object
      required: [schema, period_from, period_to, currency, generated_at, merchants, totals, ledger, balanced]
      properties:
        schema: { const: 'alovida-pay.accounting-export/v1' }
        period_from: { $ref: 'common.yaml#/components/schemas/Timestamp' }
        period_to: { $ref: 'common.yaml#/components/schemas/Timestamp' }
        currency: { $ref: 'common.yaml#/components/schemas/Currency' }
        generated_at: { $ref: 'common.yaml#/components/schemas/Timestamp' }
        merchants:
          type: array
          items:
            type: object
            required: [merchant_id, lines, total_fee_minor]
            properties:
              merchant_id: { $ref: '#/components/schemas/MerchantId' }
              lines: { type: array, items: { $ref: '#/components/schemas/AccountingExportLine' } }
              total_fee_minor: { type: integer }
        totals:
          type: object
          required: [gross_minor, fee_minor, net_minor]
          properties:
            gross_minor: { type: integer }
            fee_minor: { type: integer }
            net_minor: { type: integer }
        ledger:
          type: object
          description: Cuadre contra el ledger.
          required: [platform_fees_minor, unassigned_minor, difference_minor]
          properties:
            platform_fees_minor: { type: integer, description: 'Neto real de `platform:fees` en el periodo.' }
            unassigned_minor: { type: integer, description: Comisiones del ledger sin comercio. }
            difference_minor: { type: integer }
        balanced: { type: boolean }
