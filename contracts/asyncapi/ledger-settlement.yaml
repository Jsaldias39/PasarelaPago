components:
  messages:
    LedgerTransferPosted:
      name: ledger.transfer.posted
      title: Se asentó una transferencia en el ledger
      summary: Se asentó una transferencia en el ledger
      description: |-
        Se asentó una transferencia en el ledger

        `merchantid` es opcional: los asientos entre cuentas de plataforma (por ejemplo `platform:fees`) no pertenecen a un comercio.
      contentType: application/cloudevents+json
      x-pii: none
      x-delivery: at-least-once
      x-idempotency-key: cloudevent.id (el campo `id` del sobre; también viaja como `Nats-Msg-Id`)
      payload:
        allOf:
        - $ref: ../schemas/cloudevent.schema.json
        - type: object
          required:
          - subject
          properties:
            source:
              const: /pay-ledger
            type:
              const: ledger.transfer.posted
            subject:
              $ref: '#/components/schemas/LedgerTransferId'
            data:
              $ref: '#/components/schemas/LedgerTransferPostedData'
      examples:
      - name: ledger.transfer.posted (ejemplo)
        payload:
          specversion: '1.0'
          id: 03f27720-904f-5a37-bd11-d8243aab9df8
          source: /pay-ledger
          type: ledger.transfer.posted
          subject: tf_b1kb4f86f3q8
          time: '2026-10-27T15:00:00.000Z'
          datacontenttype: application/json
          data:
            transfer_id: tf_b1kb4f86f3q8
            ledger_ref: pi_c92215200m49:capture
            attempt: 1
            kind: capture
            debit_account: connector:mercantil_qr:clearing
            credit_account: merchant:mc_5c048c31m1fb:pending
            amount_minor: 9700
            currency: BOB
            posted_at: '2026-10-27T15:00:00.000Z'
          merchantid: mc_5c048c31m1fb
    LedgerHoldCreated:
      name: ledger.hold.created
      title: Se creó una retención (transferencia pendiente en dos fases)
      summary: Se creó una retención (transferencia pendiente en dos fases)
      description: |-
        Se creó una retención (transferencia pendiente en dos fases)

        La retención reserva el monto: la segunda fase (post o void) no puede romper el invariante de saldo. Si vence sin resolverse, el monto vuelve solo (`ledger.hold.expired`).
      contentType: application/cloudevents+json
      x-pii: none
      x-delivery: at-least-once
      x-idempotency-key: cloudevent.id (el campo `id` del sobre; también viaja como `Nats-Msg-Id`)
      payload:
        allOf:
        - $ref: ../schemas/cloudevent.schema.json
        - type: object
          required:
          - subject
          properties:
            source:
              const: /pay-ledger
            type:
              const: ledger.hold.created
            subject:
              $ref: '#/components/schemas/HoldId'
            data:
              $ref: '#/components/schemas/LedgerHoldCreatedData'
      examples:
      - name: ledger.hold.created (ejemplo)
        payload:
          specversion: '1.0'
          id: 8ebf75c9-aba9-5f14-9777-3cbbd2eca202
          source: /pay-ledger
          type: ledger.hold.created
          subject: hd_qq916q525259
          time: '2026-10-27T15:00:00.000Z'
          datacontenttype: application/json
          data:
            hold_id: hd_qq916q525259
            ledger_ref: po_592272mccf7m:payout
            attempt: 1
            account: merchant:mc_5c048c31m1fb:available
            amount_minor: 50000
            currency: BOB
            expires_at: '2026-10-27T15:30:00.000Z'
          merchantid: mc_5c048c31m1fb
    LedgerHoldPosted:
      name: ledger.hold.posted
      title: Se confirmó la retención
      summary: Se confirmó la retención
      description: |-
        Se confirmó la retención

        Una retención se resuelve una sola vez (post o void).
      contentType: application/cloudevents+json
      x-pii: none
      x-delivery: at-least-once
      x-idempotency-key: cloudevent.id (el campo `id` del sobre; también viaja como `Nats-Msg-Id`)
      payload:
        allOf:
        - $ref: ../schemas/cloudevent.schema.json
        - type: object
          required:
          - subject
          properties:
            source:
              const: /pay-ledger
            type:
              const: ledger.hold.posted
            subject:
              $ref: '#/components/schemas/HoldId'
            data:
              $ref: '#/components/schemas/LedgerHoldPostedData'
      examples:
      - name: ledger.hold.posted (ejemplo)
        payload:
          specversion: '1.0'
