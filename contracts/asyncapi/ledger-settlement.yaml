# Eventos de pay-ledger y pay-settlement (P2). BORRADOR `v1-draft`.
asyncapi: 3.0.0
info:
  title: Eventos de pay-ledger y pay-settlement (P2)
  version: 1.0.0-draft
  description: |-
    BORRADOR de la ola 0 (`v1-draft`): todavía NO está congelado. Dueño: P2 (`pay-ledger`, `pay-settlement`). Revisan los consumidores listados en cada operación.

    **Sobre.** Todo evento es un CloudEvent 1.0 en modo estructurado JSON (`contracts/schemas/cloudevent.schema.json`),
    publicado por el outbox del servicio hacia JetStream con el `id` del evento como `Nats-Msg-Id`.
    `data` lleva SOLO ids, estados e importes (`amount_minor` en centavos, `currency`): nunca datos personales,
    documentos, PAN, nombres ni cuentas bancarias completas (`x-pii: none`).

    **Entrega: al menos una vez.** El consumidor DEBE tolerar duplicados y reordenamiento:
    - Duplicado: el mismo `id` otra vez. Se descarta con el inbox (`processOnce`, clave `(consumidor, id)`).
    - Reordenamiento: el orden solo se garantiza **por agregado** (mismo `subject`, publicados por un único relé).
      Entre agregados distintos no hay orden. Un evento atrasado no puede hacer retroceder un estado terminal.
    - Regla de decisión del consumidor ante un evento, tomando como modelo `payment-callback-machine` de la API:
      `aplicar` (avance legítimo) · `duplicado` (reentrega del mismo hecho: no muta nada) · `obsoleto`
      (hecho anterior ya superado: se ignora sin error) · `contradiccion` (incompatible con un estado terminal:
      no se sobrescribe, se deja para conciliación humana).

    **Publicadores:** `pay-ledger` (`source: /pay-ledger`, stream `PAY_LEDGER`, temas `pay-ledger.>`) para `ledger.*`;
    `pay-settlement` (`source: /pay-settlement`, stream `PAY_SETTLEMENT`, temas `pay-settlement.>`) para `payout.*`, `settlement.batch.closed` y `reconciliation.exception.opened`.
    **Consumidores (PLAN-MAESTRO §4):** P1 (`pay-webhooks`) y P5 (`pay-schedules`).

    Los temas llevan el prefijo del servicio y después el `type`, por eso `ledger.transfer.posted` sale en `pay-ledger.ledger.transfer.posted`.
    Los montos de asientos y retenciones son enteros ≥ 1; las cuentas son códigos lógicos del plan de cuentas, nunca números de cuenta bancaria.
    **Idempotencia del ledger:** el `transfer_id`/`hold_id` se deriva de `(ledger_ref, attempt)`. Un intento rechazado quema su id (spike TigerBeetle, `id_already_failed`); el reintento sube `attempt`.

    **Ids.** `transfer_id` (`tf_…`) identifica UNA pata de un asiento; el asiento es `tx_…` y la retención `hd_…` (`internal-ledger-v1.yaml`).
    Los eventos de otros servicios que citan el asiento (`ledger_transfer_id`) usan `tx_…` o `hd_…`, no `tf_…`.

    **Qué NO se publica.** La liberación `pending → available` del corte (`release`) asienta pero no publica `ledger.transfer.posted`: el
    corte lo informa `settlement.batch.closed`.

    **Nombres.** El simulador se llama `mock` (como en las APIs); `simulator` es un alias heredado que se sigue aceptando.
servers:
  nats:
    host: nats.pay.internal:4222
    protocol: nats
    description: 'NATS JetStream (D-10). El host es un marcador: el real se define al desplegar. Streams `PAY_LEDGER`
      (temas `pay-ledger.>`) y `PAY_SETTLEMENT` (temas `pay-settlement.>`).'
