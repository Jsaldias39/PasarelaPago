  schemas:
    AmountMinor:
      $ref: ../openapi/common.yaml#/components/schemas/AmountMinor
    Currency:
      $ref: ../openapi/common.yaml#/components/schemas/Currency
    Timestamp:
      $ref: ../openapi/common.yaml#/components/schemas/Timestamp
    MerchantId:
      type: string
      pattern: ^mc_[a-z0-9]{10,40}$
    PaymentIntentId:
      type: string
      pattern: ^pi_[a-z0-9]{10,40}$
    LedgerTransferId:
      type: string
      pattern: ^tf_[a-z0-9]{10,40}$
      description: Id de una PATA asentada en pay-ledger (se deriva del asiento `tx_…` o de la retención `hd_…` y del índice de la pata; un
        asiento de N patas publica N eventos con N ids distintos).
    HoldId:
      type: string
      pattern: ^hd_[a-z0-9]{10,40}$
    PayoutId:
      type: string
      pattern: ^po_[a-z0-9]{10,40}$
    SettlementBatchId:
      type: string
      pattern: ^sb_[a-z0-9]{10,40}$
    ReconciliationExceptionId:
      type: string
      pattern: ^rx_[a-z0-9]{10,40}$
    ConnectorCode:
      type: string
      enum:
      - mock
      - simulator
      - mercantil_qr
      - mercantil_card
      - bank_transfer
      description: Conector (D-16). `mock` es el simulador, con el mismo nombre que en las APIs; `simulator` es un alias heredado que se sigue
        aceptando mientras los productores migran. Un banco nuevo agrega un valor; no se renombran los existentes.
    LedgerAccount:
      type: string
      pattern: ^(merchant|user|platform|connector|payout|schedule):[a-z0-9_.-]+(:[a-z_]+)?$|^platform:[a-z_]+$
      description: Código lógico de cuenta del plan de cuentas (PLAN-MAESTRO §3.3). Solo ids, nunca números de cuenta
        bancaria.
    LedgerTransferPostedData:
      type: object
      additionalProperties: false
      required:
      - transfer_id
      - ledger_ref
      - attempt
      - kind
      - debit_account
      - credit_account
      - amount_minor
      - currency
      - posted_at
      properties:
        transfer_id:
          $ref: '#/components/schemas/LedgerTransferId'
        ledger_ref:
          type: string
          minLength: 3
          maxLength: 120
          description: Referencia de negocio estable (por ejemplo `pi_xxx:capture`). Junto con `attempt` determina
            el id de 128 bits en TigerBeetle.
        attempt:
          type: integer
          minimum: 1
          description: 'Intento del ledger. Una transferencia RECHAZADA no se puede reintentar con el mismo id (`id_already_failed`,
            spike TigerBeetle): el reintento usa attempt + 1.'
        kind:
          type: string
          description: Tipo de movimiento (`code` de la pata en `internal-ledger-v1.yaml`). `release` (liberación `pending → available`) no tiene
            `kind` porque no se publica.
          enum:
          - capture
          - fee
          - refund
          - payout
          - dispute
          - wallet
          - commission
          - scheduled_payment
          - adjustment
        debit_account:
          $ref: '#/components/schemas/LedgerAccount'
        credit_account:
          $ref: '#/components/schemas/LedgerAccount'
        amount_minor:
          allOf:
          - $ref: '#/components/schemas/AmountMinor'
          - minimum: 1
        currency:
          $ref: '#/components/schemas/Currency'
        posted_at:
          $ref: '#/components/schemas/Timestamp'
      description: Se asentó una transferencia en el ledger
    LedgerHoldCreatedData:
      type: object
      additionalProperties: false
      required:
      - hold_id
      - ledger_ref
      - attempt
      - account
      - amount_minor
      - currency
      - expires_at
      properties:
        hold_id:
          $ref: '#/components/schemas/HoldId'
        ledger_ref:
          type: string
          minLength: 3
          maxLength: 120
        attempt:
          type: integer
          minimum: 1
        account:
          $ref: '#/components/schemas/LedgerAccount'
        amount_minor:
          allOf:
          - $ref: '#/components/schemas/AmountMinor'
          - minimum: 1
        currency:
          $ref: '#/components/schemas/Currency'
        expires_at:
          $ref: '#/components/schemas/Timestamp'
      description: Se creó una retención (transferencia pendiente en dos fases)
    LedgerHoldPostedData:
      type: object
      additionalProperties: false
      required:
      - hold_id
      - ledger_ref
      - account
      - posted_amount_minor
      - currency
      - transfer_id
      - posted_at
      properties:
        hold_id:
          $ref: '#/components/schemas/HoldId'
        ledger_ref:
          type: string
          minLength: 3
          maxLength: 120
        account:
          $ref: '#/components/schemas/LedgerAccount'
        posted_amount_minor:
          allOf:
          - $ref: '#/components/schemas/AmountMinor'
          - minimum: 1
        currency:
          $ref: '#/components/schemas/Currency'
        transfer_id:
          $ref: '#/components/schemas/LedgerTransferId'
        posted_at:
          $ref: '#/components/schemas/Timestamp'
      description: Se confirmó la retención
    LedgerHoldVoidedData:
      type: object
      additionalProperties: false
      required:
      - hold_id
      - ledger_ref
      - account
      - amount_minor
      - currency
      - reason
      - voided_at
      properties:
        hold_id:
          $ref: '#/components/schemas/HoldId'
        ledger_ref:
          type: string
          minLength: 3
          maxLength: 120
        account:
          $ref: '#/components/schemas/LedgerAccount'
        amount_minor:
          allOf:
          - $ref: '#/components/schemas/AmountMinor'
          - minimum: 1
        currency:
          $ref: '#/components/schemas/Currency'
        reason:
          type: string
          enum:
          - requested
          - downstream_failed
        voided_at:
          $ref: '#/components/schemas/Timestamp'
      description: Se anuló la retención y el monto volvió a la cuenta
    LedgerHoldExpiredData:
      type: object
      additionalProperties: false
      required:
      - hold_id
      - ledger_ref
      - account
      - amount_minor
      - currency
      - expired_at
      properties:
        hold_id:
          $ref: '#/components/schemas/HoldId'
        ledger_ref:
          type: string
          minLength: 3
          maxLength: 120
        account:
          $ref: '#/components/schemas/LedgerAccount'
        amount_minor:
          allOf:
          - $ref: '#/components/schemas/AmountMinor'
          - minimum: 1
        currency:
          $ref: '#/components/schemas/Currency'
        expired_at:
          $ref: '#/components/schemas/Timestamp'
      description: La retención venció sin resolverse y el monto volvió a la cuenta
    PayoutCreatedData:
      type: object
      additionalProperties: false
      required:
      - payout_id
      - merchant_id
      - amount_minor
      - currency
      - status
      - period_from
      - period_to
      properties:
        mode:
          $ref: '#/components/schemas/Mode'
        payout_id:
          $ref: '#/components/schemas/PayoutId'
        merchant_id:
          $ref: '#/components/schemas/MerchantId'
        settlement_batch_id:
          description: Corte del que nace el pago. Ausente en un pago suelto (`manual`, `mandate_obligation`, `mandate_commission`).
          $ref: '#/components/schemas/SettlementBatchId'
        amount_minor:
          allOf:
          - $ref: '#/components/schemas/AmountMinor'
          - minimum: 1
        currency:
          $ref: '#/components/schemas/Currency'
        status:
          const: pending
        period_from:
          $ref: '#/components/schemas/Timestamp'
        period_to:
          $ref: '#/components/schemas/Timestamp'
      description: Se creó una liquidación al comercio
    PayoutPaidData:
      type: object
      additionalProperties: false
      required:
      - payout_id
      - merchant_id
      - amount_minor
      - currency
      - status
      - paid_at
      properties:
        mode:
          $ref: '#/components/schemas/Mode'
        payout_id:
          $ref: '#/components/schemas/PayoutId'
        merchant_id:
          $ref: '#/components/schemas/MerchantId'
        amount_minor:
          allOf:
          - $ref: '#/components/schemas/AmountMinor'
          - minimum: 1
        currency:
          $ref: '#/components/schemas/Currency'
        status:
          const: paid
        paid_at:
          $ref: '#/components/schemas/Timestamp'
      description: La liquidación se pagó al comercio
    PayoutFailedData:
      type: object
      additionalProperties: false
      required:
      - payout_id
      - merchant_id
      - amount_minor
      - currency
      - status
      - failure_code
      - failed_at
      properties:
        mode:
          $ref: '#/components/schemas/Mode'
        payout_id:
          $ref: '#/components/schemas/PayoutId'
        merchant_id:
          $ref: '#/components/schemas/MerchantId'
        amount_minor:
          allOf:
          - $ref: '#/components/schemas/AmountMinor'
          - minimum: 1
        currency:
          $ref: '#/components/schemas/Currency'
        status:
          const: failed
        failure_code:
          type: string
          enum:
          - insufficient_funds
          - connector_unavailable
          - ledger_unavailable
          - rail_rejected
          - internal_error
        failed_at:
          $ref: '#/components/schemas/Timestamp'
      description: La liquidación falló; la retención se anuló y el saldo quedó intacto
    SettlementBatchClosedData:
      type: object
      additionalProperties: false
      required:
      - settlement_batch_id
      - period_from
      - period_to
      - currency
      - merchants_count
      - payouts_count
      - released_minor
      - closed_at
      properties:
        settlement_batch_id:
          $ref: '#/components/schemas/SettlementBatchId'
        period_from:
          $ref: '#/components/schemas/Timestamp'
        period_to:
          $ref: '#/components/schemas/Timestamp'
        currency:
          $ref: '#/components/schemas/Currency'
        merchants_count:
          type: integer
          minimum: 0
        payouts_count:
          type: integer
          minimum: 0
        released_minor:
          allOf:
          - $ref: '#/components/schemas/AmountMinor'
          description: Total que pasó de pendiente a disponible en este corte.
        closed_at:
          $ref: '#/components/schemas/Timestamp'
      description: 'Se cerró el corte semanal de liquidación (D-19: lunes, T+7)'
    ReconciliationExceptionOpenedData:
      type: object
      additionalProperties: false
      required:
      - exception_id
      - connector
      - kind
      - difference_minor
      - currency
      - statement_line_ref
      - opened_at
      properties:
        exception_id:
          $ref: '#/components/schemas/ReconciliationExceptionId'
        connector:
          $ref: '#/components/schemas/ConnectorCode'
        kind:
          type: string
          enum:
          - missing_in_ledger
          - missing_in_statement
          - amount_mismatch
          - duplicate_in_statement
          - unknown_reference
        difference_minor:
          type: integer
          description: Extracto menos ledger, en centavos; con signo.
        currency:
          $ref: '#/components/schemas/Currency'
        payment_intent_id:
          oneOf:
          - $ref: '#/components/schemas/PaymentIntentId'
          - type: 'null'
        statement_line_ref:
          type: string
          minLength: 1
          maxLength: 200
          description: Referencia opaca a la línea del extracto; nunca el texto de la línea.
        opened_at:
          $ref: '#/components/schemas/Timestamp'
      description: La conciliación encontró una diferencia; el ledger NO se ajusta solo
    Mode:
      type: string
      enum:
      - test
      - live
