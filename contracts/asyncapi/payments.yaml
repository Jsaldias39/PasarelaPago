# Eventos de pay-payments (P3). BORRADOR `v1-draft`. Generado desde una descripción compacta; se edita a mano desde acá.
asyncapi: 3.0.0
info:
  title: Eventos de pay-payments (P3)
  version: 1.0.0-draft
  description: |-
    BORRADOR de la ola 0 (`v1-draft`): todavía NO está congelado. Dueño: P3 (`pay-payments`). Revisan los consumidores listados en cada operación.

    **Sobre.** Todo evento es un CloudEvent 1.0 en modo estructurado JSON (`contracts/schemas/cloudevent.schema.json`),
    publicado por el outbox del servicio hacia JetStream con el `id` del evento como `Nats-Msg-Id`.
    `data` lleva SOLO ids, estados e importes (`amount_minor` en centavos, `currency`): nunca datos personales,
    documentos, PAN, nombres ni cuentas bancarias completas (`x-pii: none`).

    **Entrega: al menos una vez.** El consumidor DEBE tolerar duplicados y reordenamiento:
    - Duplicado: el mismo `id` otra vez. Se descarta con el inbox (`processOnce`, clave `(consumidor, id)`).
    - Reordenamiento: el orden solo se garantiza **por agregado** (mismo `subject`, publicados por un único relé).
      Entre agregados distintos no hay orden. Un evento atrasado no puede hacer retroceder un estado terminal.
    - Regla de decisión del consumidor ante un evento, tomando como modelo `payment-callback-machine` de la API:
      `aplicar` (avance legítimo) · `duplicado` (reentrega del mismo hecho: no muta nada) · `obsoleto`
      (hecho anterior ya superado: se ignora sin error) · `contradiccion` (incompatible con un estado terminal:
      no se sobrescribe, se deja para conciliación humana).

    **Publicador:** `pay-payments` (`source: /pay-payments`), stream `PAY_PAYMENTS`, temas `pay-payments.>`.
    **Consumidores (PLAN-MAESTRO §4):** P1 (`pay-webhooks`), P2 (`pay-settlement`) y P5 (`pay-schedules`).

    **Estados.** Los de `status` coinciden con `PaymentIntentStatus`, `Refund.status` de `public-v1.yaml`; los de
    `failure_code`, con los `code` de `@pay/problem`. `succeeded`, `failed`, `canceled` y `expired` son terminales: un cobro
    termina en uno solo, pase lo que pase en el medio (REQ-P3). `dispute.status` (`open`, `won`, `lost`) no existe aún en la API pública.

    **Asiento del ledger.** `ledger_transfer_id` cita el asiento (`tx_…`) o la retención confirmada (`hd_…`) que `pay-ledger` le devolvió
    a `pay-payments` (`internal-ledger-v1.yaml`); no se fabrica un `tf_…`, que en el ledger identifica una pata. Se sigue aceptando `tf_…`
    por compatibilidad.

    **Modo (D-28).** Todo evento público puede llevar `mode` (`test|live`), el de la clave que originó el hecho. Es opcional hasta que
    `pay-payments` lo implemente (ola 2).

    **Evento interno.** `payment_intent.contradiction_detected` NO es público (no sale por webhooks): lo consume la conciliación humana.
servers:
  nats:
    host: nats.pay.internal:4222
    protocol: nats
    description: 'NATS JetStream (D-10). El host es un marcador: el real se define al desplegar. Stream `PAY_PAYMENTS`,
      temas `pay-payments.>`.'
