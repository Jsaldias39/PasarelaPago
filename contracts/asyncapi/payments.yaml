    PaymentIntentContradictionDetected:
      name: payment_intent.contradiction_detected
      title: El conector dijo algo incompatible con el estado del cobro, o un resultado de dinero quedó ambiguo
      summary: El conector dijo algo incompatible con el estado del cobro, o un resultado de dinero quedó ambiguo
      description: |-
        El conector dijo algo incompatible con el estado del cobro, o un resultado de dinero quedó ambiguo

        Interno: NO sale por webhooks. `pay-payments` no sobrescribe un estado terminal ni anula una retención por una duda (CLAUDE.md,
        regla 11); lo deja registrado y lo publica para que una persona lo resuelva por conciliación (REQ-P3-3). Es único por
        cobro y evento de origen: la reentrega no lo duplica.
      contentType: application/cloudevents+json
      x-pii: none
      x-delivery: at-least-once
      x-idempotency-key: cloudevent.id (el campo `id` del sobre; también viaja como `Nats-Msg-Id`)
      payload:
        allOf:
        - $ref: ../schemas/cloudevent.schema.json
        - type: object
          required:
          - subject
          - merchantid
          properties:
            source:
              const: /pay-payments
            type:
              const: payment_intent.contradiction_detected
            subject:
              $ref: '#/components/schemas/PaymentIntentId'
            data:
              $ref: '#/components/schemas/PaymentIntentContradictionDetectedData'
      examples:
      - name: payment_intent.contradiction_detected (ejemplo)
        payload:
          specversion: '1.0'
          id: 3b7c1d3e-5a0f-5f0e-9c43-2a3f7c9d1e11
          source: /pay-payments
          type: payment_intent.contradiction_detected
          subject: pi_c92215200m49
          time: '2026-10-27T15:00:00.000Z'
          datacontenttype: application/json
          data:
            payment_intent_id: pi_c92215200m49
            merchant_id: mc_5c048c31m1fb
            kind: status_conflict
            current_status: failed
            incoming_status: captured
            detected_at: '2026-10-27T15:00:00.000Z'
          merchantid: mc_5c048c31m1fb
  schemas:
    AmountMinor:
      $ref: ../openapi/common.yaml#/components/schemas/AmountMinor
    Currency:
      $ref: ../openapi/common.yaml#/components/schemas/Currency
    Timestamp:
      $ref: ../openapi/common.yaml#/components/schemas/Timestamp
    MerchantId:
      type: string
      pattern: ^mc_[a-z0-9]{10,40}$
    PaymentIntentId:
      type: string
      pattern: ^pi_[a-z0-9]{10,40}$
    RefundId:
      type: string
      pattern: ^re_[a-z0-9]{10,40}$
    DisputeId:
      type: string
      pattern: ^dp_[a-z0-9]{10,40}$
    LedgerTransferId:
      type: string
      pattern: ^(tx|hd|tf)_[a-z0-9]{10,40}$
      description: Id del asiento (`tx_…`) o de la retención confirmada (`hd_…`) en pay-ledger, tal como los devolvió `internal-ledger-v1.yaml`.
        `tf_…` (una pata del asiento) se acepta por compatibilidad y no es lo recomendado.
    ConnectorCode:
      type: string
      enum:
      - mock
      - simulator
      - mercantil_qr
      - mercantil_card
      - bank_transfer
      description: Conector (D-16). `mock` es el simulador, con el mismo nombre que en `internal-connectors-v1.yaml`; `simulator` es un alias
        heredado que se sigue aceptando mientras los productores migran y no se usa en ninguna API. Un banco nuevo agrega un valor; no se
        renombran los existentes.
    PaymentMethodType:
      type: string
      enum:
      - qr
      - card
      - bank_transfer
      - wallet
    PaymentIntentCreatedData:
      type: object
      additionalProperties: false
      required:
      - payment_intent_id
      - merchant_id
      - amount_minor
      - currency
      - payment_method_type
      - status
      - fee_minor
      - net_minor
      - expires_at
      properties:
        mode:
          $ref: '#/components/schemas/Mode'
        payment_intent_id:
          $ref: '#/components/schemas/PaymentIntentId'
        merchant_id:
          $ref: '#/components/schemas/MerchantId'
        amount_minor:
          $ref: '#/components/schemas/AmountMinor'
        currency:
          $ref: '#/components/schemas/Currency'
        payment_method_type:
          $ref: '#/components/schemas/PaymentMethodType'
        status:
          type: string
          enum:
          - requires_action
          - processing
          description: Estado al crearse. El enum público no tiene un estado inicial propio.
        fee_minor:
          $ref: '#/components/schemas/AmountMinor'
        net_minor:
          $ref: '#/components/schemas/AmountMinor'
        expires_at:
          $ref: '#/components/schemas/Timestamp'
      description: Se creó un cobro
    PaymentIntentRequiresActionData:
      type: object
      additionalProperties: false
      required:
      - payment_intent_id
      - merchant_id
      - status
      - next_action_type
      - expires_at
      properties:
        mode:
          $ref: '#/components/schemas/Mode'
        payment_intent_id:
          $ref: '#/components/schemas/PaymentIntentId'
        merchant_id:
          $ref: '#/components/schemas/MerchantId'
        status:
          const: requires_action
        next_action_type:
          type: string
          enum:
          - display_qr
          - bank_transfer_instructions
          - redirect_to_card_form
        expires_at:
          $ref: '#/components/schemas/Timestamp'
      description: El pagador tiene que hacer algo para completar el cobro
    PaymentIntentProcessingData:
      type: object
      additionalProperties: false
      required:
      - payment_intent_id
      - merchant_id
      - status
      properties:
        mode:
          $ref: '#/components/schemas/Mode'
        payment_intent_id:
          $ref: '#/components/schemas/PaymentIntentId'
        merchant_id:
          $ref: '#/components/schemas/MerchantId'
        status:
          const: processing
        connector:
          $ref: '#/components/schemas/ConnectorCode'
      description: El cobro está en proceso en el proveedor
    PaymentIntentSucceededData:
      type: object
      additionalProperties: false
      required:
      - payment_intent_id
      - merchant_id
      - amount_minor
      - currency
      - status
      - payment_method_type
      - fee_minor
      - net_minor
      - ledger_transfer_id
      - succeeded_at
      properties:
        mode:
          $ref: '#/components/schemas/Mode'
        payment_intent_id:
          $ref: '#/components/schemas/PaymentIntentId'
        merchant_id:
          $ref: '#/components/schemas/MerchantId'
        amount_minor:
          $ref: '#/components/schemas/AmountMinor'
        currency:
          $ref: '#/components/schemas/Currency'
        status:
          const: succeeded
        payment_method_type:
          $ref: '#/components/schemas/PaymentMethodType'
        fee_minor:
          $ref: '#/components/schemas/AmountMinor'
        net_minor:
          $ref: '#/components/schemas/AmountMinor'
        ledger_transfer_id:
          $ref: '#/components/schemas/LedgerTransferId'
        succeeded_at:
          $ref: '#/components/schemas/Timestamp'
      description: El cobro se completó y quedó asentado en el ledger
    PaymentIntentFailedData:
      type: object
      additionalProperties: false
      required:
      - payment_intent_id
      - merchant_id
      - status
      - failure_code
      - failed_at
      properties:
        mode:
          $ref: '#/components/schemas/Mode'
        payment_intent_id:
          $ref: '#/components/schemas/PaymentIntentId'
        merchant_id:
          $ref: '#/components/schemas/MerchantId'
        status:
          const: failed
        failure_code:
          type: string
          enum:
          - insufficient_funds
          - connector_unavailable
          - risk_unavailable
          - ledger_unavailable
          - merchant_suspended
          - risk_denied
          - payment_declined
          - validation_failed
          - internal_error
        failed_at:
          $ref: '#/components/schemas/Timestamp'
      description: El cobro falló
    PaymentIntentCanceledData:
      type: object
      additionalProperties: false
      required:
      - payment_intent_id
      - merchant_id
      - status
      - canceled_at
      properties:
        mode:
          $ref: '#/components/schemas/Mode'
        payment_intent_id:
          $ref: '#/components/schemas/PaymentIntentId'
        merchant_id:
          $ref: '#/components/schemas/MerchantId'
        status:
          const: canceled
        canceled_at:
          $ref: '#/components/schemas/Timestamp'
      description: El cobro se canceló antes de pagarse
    PaymentIntentExpiredData:
      type: object
      additionalProperties: false
      required:
      - payment_intent_id
      - merchant_id
      - status
      - expired_at
      properties:
        mode:
          $ref: '#/components/schemas/Mode'
        payment_intent_id:
          $ref: '#/components/schemas/PaymentIntentId'
        merchant_id:
          $ref: '#/components/schemas/MerchantId'
        status:
          const: expired
        expired_at:
          $ref: '#/components/schemas/Timestamp'
      description: El cobro venció sin pagarse
    RefundCreatedData:
      type: object
      additionalProperties: false
      required:
      - refund_id
      - payment_intent_id
      - merchant_id
      - amount_minor
      - currency
      - status
      properties:
        mode:
          $ref: '#/components/schemas/Mode'
        refund_id:
          $ref: '#/components/schemas/RefundId'
        payment_intent_id:
          $ref: '#/components/schemas/PaymentIntentId'
        merchant_id:
          $ref: '#/components/schemas/MerchantId'
        amount_minor:
          $ref: '#/components/schemas/AmountMinor'
        currency:
          $ref: '#/components/schemas/Currency'
        status:
          const: pending
        reason:
          type: string
          enum:
          - requested_by_customer
          - duplicate
          - fraudulent
          - other
      description: Se creó un reembolso
    RefundSucceededData:
      type: object
      additionalProperties: false
      required:
      - refund_id
      - payment_intent_id
      - merchant_id
      - amount_minor
      - currency
      - status
      - ledger_transfer_id
      properties:
        mode:
          $ref: '#/components/schemas/Mode'
        refund_id:
          $ref: '#/components/schemas/RefundId'
        payment_intent_id:
          $ref: '#/components/schemas/PaymentIntentId'
        merchant_id:
          $ref: '#/components/schemas/MerchantId'
        amount_minor:
          $ref: '#/components/schemas/AmountMinor'
        currency:
          $ref: '#/components/schemas/Currency'
        status:
          const: succeeded
        ledger_transfer_id:
          $ref: '#/components/schemas/LedgerTransferId'
      description: El reembolso se completó
    RefundFailedData:
      type: object
      additionalProperties: false
      required:
      - refund_id
      - payment_intent_id
      - merchant_id
      - amount_minor
      - currency
      - status
      - failure_code
      properties:
        mode:
          $ref: '#/components/schemas/Mode'
        refund_id:
          $ref: '#/components/schemas/RefundId'
        payment_intent_id:
          $ref: '#/components/schemas/PaymentIntentId'
        merchant_id:
          $ref: '#/components/schemas/MerchantId'
        amount_minor:
          $ref: '#/components/schemas/AmountMinor'
        currency:
          $ref: '#/components/schemas/Currency'
        status:
          const: failed
        failure_code:
          type: string
          enum:
          - insufficient_funds
          - connector_unavailable
          - ledger_unavailable
          - invalid_state_transition
          - internal_error
      description: El reembolso falló; la retención del ledger se anuló
    DisputeOpenedData:
      type: object
      additionalProperties: false
      required:
      - dispute_id
      - payment_intent_id
      - merchant_id
      - amount_minor
      - currency
      - status
      - opened_at
      properties:
        mode:
          $ref: '#/components/schemas/Mode'
        dispute_id:
          $ref: '#/components/schemas/DisputeId'
        payment_intent_id:
          $ref: '#/components/schemas/PaymentIntentId'
        merchant_id:
          $ref: '#/components/schemas/MerchantId'
        amount_minor:
          $ref: '#/components/schemas/AmountMinor'
        currency:
          $ref: '#/components/schemas/Currency'
        status:
          const: open
        opened_at:
          $ref: '#/components/schemas/Timestamp'
      description: Se abrió una disputa sobre un cobro
    DisputeWonData:
      type: object
      additionalProperties: false
      required:
      - dispute_id
      - payment_intent_id
      - merchant_id
      - amount_minor
      - currency
      - status
      - resolved_at
      properties:
        mode:
          $ref: '#/components/schemas/Mode'
        dispute_id:
          $ref: '#/components/schemas/DisputeId'
        payment_intent_id:
          $ref: '#/components/schemas/PaymentIntentId'
        merchant_id:
          $ref: '#/components/schemas/MerchantId'
        amount_minor:
          $ref: '#/components/schemas/AmountMinor'
        currency:
          $ref: '#/components/schemas/Currency'
        status:
          const: won
        resolved_at:
          $ref: '#/components/schemas/Timestamp'
      description: La disputa se resolvió a favor del comercio
    DisputeLostData:
      type: object
      additionalProperties: false
      required:
      - dispute_id
      - payment_intent_id
      - merchant_id
      - amount_minor
      - currency
      - status
      - resolved_at
      - ledger_transfer_id
      properties:
        mode:
          $ref: '#/components/schemas/Mode'
        dispute_id:
          $ref: '#/components/schemas/DisputeId'
        payment_intent_id:
          $ref: '#/components/schemas/PaymentIntentId'
        merchant_id:
          $ref: '#/components/schemas/MerchantId'
        amount_minor:
          $ref: '#/components/schemas/AmountMinor'
        currency:
          $ref: '#/components/schemas/Currency'
        status:
          const: lost
        resolved_at:
          $ref: '#/components/schemas/Timestamp'
        ledger_transfer_id:
          $ref: '#/components/schemas/LedgerTransferId'
      description: 'La disputa se perdió: el importe se debita del comercio (D-22)'
    Mode:
      type: string
      enum:
      - test
      - live
      description: Modo de la CLAVE que originó el hecho (D-28). Opcional mientras el productor no lo implemente (ola 2); los
        eventos públicos lo llevan para que un consumidor distinga un hecho `test` de uno `live`. No es el modo del despliegue
        (`sandbox|live`).
    PaymentIntentContradictionDetectedData:
      type: object
      additionalProperties: false
      required:
      - payment_intent_id
      - merchant_id
      - kind
      - current_status
      - incoming_status
      - detected_at
      properties:
        payment_intent_id:
          $ref: '#/components/schemas/PaymentIntentId'
        merchant_id:
          $ref: '#/components/schemas/MerchantId'
        kind:
          type: string
          pattern: ^[a-z][a-z_]{2,39}$
          description: 'Qué se detectó. `status_conflict`: el conector informó un estado incompatible con el ya aplicado.
            `compensation_failed` y `refund_pending_timeout`: una compensación o un reembolso quedaron sin resolver.
            `<paso>_outcome_unknown` (por ejemplo `charge_outcome_unknown`, `ledger_outcome_unknown`, `refund_outcome_unknown`):
            una orden que mueve dinero terminó en un resultado ambiguo. Se agregan valores; no se renombran.'
        current_status:
          type: string
          minLength: 1
          maxLength: 40
          description: Estado que tenía el cobro (o el reembolso o la disputa, con prefijo) cuando se detectó.
        incoming_status:
          type: string
          minLength: 1
          maxLength: 40
          description: Estado que informó el conector, o `ambiguous` / `compensation_failed` cuando no hay un estado ajeno.
        mode:
          $ref: '#/components/schemas/Mode'
        detected_at:
          $ref: '#/components/schemas/Timestamp'
      description: Se detectó una contradicción o un resultado ambiguo que requiere a una persona
