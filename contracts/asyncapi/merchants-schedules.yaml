    x-consumer: pay-webhooks
    x-lane: P1
    x-inbox-consumer: pay-webhooks.merchant.created
    messages:
    - $ref: '#/channels/merchantCreated/messages/MerchantCreated'
  consumeMerchantCreatedByPaySettlement:
    action: receive
    channel:
      $ref: '#/channels/merchantCreated'
    summary: pay-settlement (P2) consume merchant.created
