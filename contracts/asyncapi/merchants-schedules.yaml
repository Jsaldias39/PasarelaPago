# Eventos de pay-merchants y pay-schedules (P5). BORRADOR `v1-draft`.
asyncapi: 3.0.0
info:
  title: Eventos de pay-merchants y pay-schedules (P5)
  version: 1.0.0-draft
  description: |-
    BORRADOR de la ola 0 (`v1-draft`): todavía NO está congelado. Dueño: P5 (`pay-merchants`, `pay-schedules`). Revisan los consumidores listados en cada operación.

    **Sobre.** Todo evento es un CloudEvent 1.0 en modo estructurado JSON (`contracts/schemas/cloudevent.schema.json`),
    publicado por el outbox del servicio hacia JetStream con el `id` del evento como `Nats-Msg-Id`.
    `data` lleva SOLO ids, estados e importes (`amount_minor` en centavos, `currency`): nunca datos personales,
    documentos, PAN, nombres ni cuentas bancarias completas (`x-pii: none`).

    **Entrega: al menos una vez.** El consumidor DEBE tolerar duplicados y reordenamiento:
    - Duplicado: el mismo `id` otra vez. Se descarta con el inbox (`processOnce`, clave `(consumidor, id)`).
    - Reordenamiento: el orden solo se garantiza **por agregado** (mismo `subject`, publicados por un único relé).
      Entre agregados distintos no hay orden. Un evento atrasado no puede hacer retroceder un estado terminal.
    - Regla de decisión del consumidor ante un evento, tomando como modelo `payment-callback-machine` de la API:
      `aplicar` (avance legítimo) · `duplicado` (reentrega del mismo hecho: no muta nada) · `obsoleto`
      (hecho anterior ya superado: se ignora sin error) · `contradiccion` (incompatible con un estado terminal:
      no se sobrescribe, se deja para conciliación humana).

    **Publicadores:** `pay-merchants` (`source: /pay-merchants`, stream `PAY_MERCHANTS`, temas `pay-merchants.>`) para `merchant.*`, `fee_schedule.published` y `api_key.*`;
    `pay-schedules` (`source: /pay-schedules`, stream `PAY_SCHEDULES`, temas `pay-schedules.>`) para `mandate.*` y `scheduled_payment.*`.
    **Consumidores (PLAN-MAESTRO §4):** P1 (`pay-edge`, `pay-webhooks`), P2 (`pay-settlement`) y P3 (`pay-payments`).

    Estos eventos son la **réplica de datos** que evita que un servicio lea la base de otro (regla de separación 5): `pay-payments` y `pay-edge` no consultan a `pay-merchants`, escuchan.
    Un consumidor nuevo arranca desde el último `fee_schedule.published` y `merchant.*` de cada comercio (reproducción del stream).

    **Asiento del ledger.** `scheduled_payment.executed.ledger_transfer_id` cita el asiento (`tx_…`) que `pay-ledger` devolvió al ejecutar el pago
    (`internal-ledger-v1.yaml`); no hace falta un id de pata `tf_…` (se sigue aceptando). Sin un id de asiento el pago no se da por ejecutado
    sin dejar rastro: queda a revisión.

    **Modo (D-28).** Los eventos `mandate.*` y `scheduled_payment.*` pueden llevar `mode` (`test|live`), el del mandato. `api_key.*` ya lo
    lleva (`mode` es obligatorio ahí). `merchant.*` y `fee_schedule.published` no tienen modo: el comercio existe en ambos.
servers:
  nats:
    host: nats.pay.internal:4222
    protocol: nats
    description: 'NATS JetStream (D-10). El host es un marcador: el real se define al desplegar. Streams `PAY_MERCHANTS`
      (temas `pay-merchants.>`) y `PAY_SCHEDULES` (temas `pay-schedules.>`).'
defaultContentType: application/cloudevents+json
