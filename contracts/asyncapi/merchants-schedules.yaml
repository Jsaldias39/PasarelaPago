        Equivale al `code` `insufficient_funds` del catálogo. `retry_at: null` indica que se agotaron los reintentos.
      contentType: application/cloudevents+json
      x-pii: none
      x-delivery: at-least-once
      x-idempotency-key: cloudevent.id (el campo `id` del sobre; también viaja como `Nats-Msg-Id`)
      payload:
        allOf:
        - $ref: ../schemas/cloudevent.schema.json
        - type: object
          required:
          - subject
          - merchantid
          properties:
            source:
              const: /pay-schedules
            type:
              const: scheduled_payment.insufficient_funds
            subject:
              $ref: '#/components/schemas/ScheduledPaymentId'
            data:
              $ref: '#/components/schemas/ScheduledPaymentInsufficientFundsData'
      examples:
      - name: scheduled_payment.insufficient_funds (ejemplo)
        payload:
          specversion: '1.0'
          id: 089a6cbb-525f-5918-99dc-a6857854473d
          source: /pay-schedules
          type: scheduled_payment.insufficient_funds
          subject: sp_kb20f479b7c3
          time: '2026-10-27T15:00:00.000Z'
          datacontenttype: application/json
          data:
            scheduled_payment_id: sp_kb20f479b7c3
            mandate_id: md_170585987bbf
            merchant_id: mc_5c048c31m1fb
            period: 2026-11
            amount_minor: 100000
            currency: BOB
            required_minor: 100000
            available_minor: 50000
            attempt: 1
            retry_at: '2026-11-06T15:00:00.000Z'
          merchantid: mc_5c048c31m1fb
  schemas:
    AmountMinor:
      $ref: ../openapi/common.yaml#/components/schemas/AmountMinor
    Currency:
      $ref: ../openapi/common.yaml#/components/schemas/Currency
    Timestamp:
      $ref: ../openapi/common.yaml#/components/schemas/Timestamp
    Date:
      type: string
      format: date
    MerchantId:
      type: string
      pattern: ^mc_[a-z0-9]{10,40}$
    LedgerTransferId:
      type: string
      pattern: ^(tx|hd|tf)_[a-z0-9]{10,40}$
      description: Id del asiento (`tx_…`) o de la retención confirmada (`hd_…`) en pay-ledger, tal como los devolvió `internal-ledger-v1.yaml`.
        `tf_…` (una pata del asiento) se acepta por compatibilidad y no es lo recomendado.
    ApiKeyId:
      type: string
      pattern: ^key_[a-z0-9]{10,40}$
    MandateId:
      type: string
      pattern: ^md_[a-z0-9]{10,40}$
    ScheduledPaymentId:
      type: string
      pattern: ^sp_[a-z0-9]{10,40}$
    Period:
      type: string
      pattern: ^\d{4}-(0[1-9]|1[0-2])$
      description: Mes del pago programado, AAAA-MM.
    MerchantCreatedData:
      type: object
      additionalProperties: false
      required:
      - merchant_id
      - status
      - created_at
      properties:
        merchant_id:
          $ref: '#/components/schemas/MerchantId'
        status:
          const: pending
        created_at:
          $ref: '#/components/schemas/Timestamp'
        legal_name:
          type: string
          minLength: 1
          maxLength: 300
          description: >-
            Razón social del comercio, para cribarla contra listas de sanciones al cobrar (D-29). Dato personal si el comercio
            es una persona natural: solo lo usan los consumidores que lo necesitan (`pay-payments`); el resto lo ignora y no
            lo persiste ni lo registra. Opcional por compatibilidad: sin él, el riesgo responde `review` (D-30).
      description: Se registró un comercio
    MerchantActivatedData:
      type: object
      additionalProperties: false
      required:
      - merchant_id
      - status
      - activated_at
      properties:
        merchant_id:
          $ref: '#/components/schemas/MerchantId'
        status:
          const: active
        activated_at:
          $ref: '#/components/schemas/Timestamp'
        legal_name:
          type: string
          minLength: 1
          maxLength: 300
          description: >-
            Razón social del comercio, para cribarla contra listas de sanciones al cobrar (D-29). Dato personal si el comercio
            es una persona natural: solo lo usan los consumidores que lo necesitan (`pay-payments`); el resto lo ignora y no
            lo persiste ni lo registra. Opcional por compatibilidad: sin él, el riesgo responde `review` (D-30).
      description: 'El comercio quedó activo: KYC aprobado y contrato aceptado'
    MerchantSuspendedData:
      type: object
      additionalProperties: false
      required:
      - merchant_id
      - status
      - suspended_at
      - reason
      properties:
        merchant_id:
          $ref: '#/components/schemas/MerchantId'
        status:
          const: suspended
        suspended_at:
          $ref: '#/components/schemas/Timestamp'
        reason:
          type: string
          enum:
          - kyc_expired
          - risk_review
          - contract_breach
          - manual
      description: 'El comercio se suspendió: no puede crear cobros'
    MerchantClosedData:
      type: object
      additionalProperties: false
      required:
      - merchant_id
      - status
      - closed_at
      properties:
        merchant_id:
          $ref: '#/components/schemas/MerchantId'
        status:
          const: closed
        closed_at:
          $ref: '#/components/schemas/Timestamp'
      description: El comercio se cerró
    FeeSchedulePublishedData:
      type: object
      additionalProperties: false
      required:
      - merchant_id
      - version
      - currency
      - effective_from
      - effective_to
      - channels
      properties:
        merchant_id:
          $ref: '#/components/schemas/MerchantId'
        version:
          type: integer
          minimum: 1
        currency:
          $ref: '#/components/schemas/Currency'
        effective_from:
          $ref: '#/components/schemas/Timestamp'
        effective_to:
          oneOf:
          - $ref: '#/components/schemas/Timestamp'
          - type: 'null'
        channels:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required:
            - channel
            - percent
            properties:
              channel:
                type: string
                enum:
                - qr
                - card
                - bank_transfer
                - wallet
                - direct
              percent:
                type: string
                pattern: ^\d{1,3}(\.\d{1,6})?$
                description: 'Porcentaje como cadena: `2.5` es el 2,5 %. Misma forma que `FeeRule.percent` de @pay/money.'
              fixed_minor:
                $ref: '#/components/schemas/AmountMinor'
              min_minor:
                $ref: '#/components/schemas/AmountMinor'
              cap_minor:
                $ref: '#/components/schemas/AmountMinor'
        monthly_fee_minor:
          allOf:
          - $ref: '#/components/schemas/AmountMinor'
          description: 'Abono mensual (D-07). Opcional: no todos los acuerdos lo tienen.'
      description: Se publicó una versión del tarifario de un comercio
    ApiKeyCreatedData:
      type: object
      additionalProperties: false
      required:
      - key_id
      - merchant_id
      - mode
      - key_hash
      - last4
      - created_at
      properties:
        key_id:
          $ref: '#/components/schemas/ApiKeyId'
        merchant_id:
          $ref: '#/components/schemas/MerchantId'
        mode:
          type: string
          enum:
          - test
          - live
        key_hash:
          type: string
          pattern: ^sha256\$[0-9a-f]{64}$
          description: 'Hash `sha256$<hex>` del secreto (D-27, `@pay/api-key`). Con él `pay-edge` verifica en tiempo constante; el secreto nunca se publica. El `key_id` viaja dentro del token (`sk_<mode>_<keyBody>_<secret>`).'
        last4:
          type: string
          minLength: 4
          maxLength: 4
        created_at:
          $ref: '#/components/schemas/Timestamp'
      description: Se creó una clave de API (nunca viaja el secreto)
    ApiKeyRevokedData:
      type: object
      additionalProperties: false
      required:
      - key_id
      - merchant_id
      - mode
      - reason
      - revoked_at
      properties:
        key_id:
          $ref: '#/components/schemas/ApiKeyId'
        merchant_id:
          $ref: '#/components/schemas/MerchantId'
        mode:
          type: string
          enum:
          - test
          - live
        reason:
          type: string
          enum:
          - revoked_by_merchant
          - rotated
          - compromised
          - merchant_closed
        revoked_at:
          $ref: '#/components/schemas/Timestamp'
      description: Se revocó una clave de API; deja de servir en segundos
    MandateCreatedData:
      type: object
      additionalProperties: false
      required:
      - mandate_id
      - merchant_id
      - status
      - kind
      - beneficiary_merchant_id
      - amount_minor
      - currency
      - frequency
      - day_of_month
      - start_date
      - end_date
      properties:
        mode:
          $ref: '#/components/schemas/Mode'
        mandate_id:
          $ref: '#/components/schemas/MandateId'
        merchant_id:
          $ref: '#/components/schemas/MerchantId'
        status:
          const: active
        kind:
          type: string
          enum:
          - pay_obligation
          - pay_commission
        beneficiary_merchant_id:
          $ref: '#/components/schemas/MerchantId'
        amount_minor:
          allOf:
          - $ref: '#/components/schemas/AmountMinor'
          - minimum: 1
        currency:
          $ref: '#/components/schemas/Currency'
        frequency:
          const: monthly
        day_of_month:
          type: integer
          minimum: 1
          maximum: 28
        start_date:
          $ref: '#/components/schemas/Date'
        end_date:
          oneOf:
          - $ref: '#/components/schemas/Date'
          - type: 'null'
      description: Se programó un pago recurrente (7.7 / 7.8)
    MandateCanceledData:
      type: object
      additionalProperties: false
      required:
      - mandate_id
      - merchant_id
      - status
      - canceled_at
      properties:
        mode:
          $ref: '#/components/schemas/Mode'
        mandate_id:
          $ref: '#/components/schemas/MandateId'
        merchant_id:
          $ref: '#/components/schemas/MerchantId'
        status:
          const: canceled
        canceled_at:
          $ref: '#/components/schemas/Timestamp'
      description: Se canceló el mandato; los pagos ya ejecutados no se deshacen
    ScheduledPaymentExecutedData:
      type: object
      additionalProperties: false
      required:
      - scheduled_payment_id
      - mandate_id
      - merchant_id
      - period
      - amount_minor
      - currency
      - ledger_transfer_id
      - executed_at
      properties:
        mode:
          $ref: '#/components/schemas/Mode'
        scheduled_payment_id:
          $ref: '#/components/schemas/ScheduledPaymentId'
        mandate_id:
          $ref: '#/components/schemas/MandateId'
        merchant_id:
          $ref: '#/components/schemas/MerchantId'
        period:
          $ref: '#/components/schemas/Period'
        amount_minor:
          allOf:
          - $ref: '#/components/schemas/AmountMinor'
          - minimum: 1
        currency:
          $ref: '#/components/schemas/Currency'
        ledger_transfer_id:
          $ref: '#/components/schemas/LedgerTransferId'
        executed_at:
          $ref: '#/components/schemas/Timestamp'
      description: El pago programado de un periodo se ejecutó
    ScheduledPaymentFailedData:
      type: object
      additionalProperties: false
      required:
      - scheduled_payment_id
      - mandate_id
      - merchant_id
      - period
      - amount_minor
      - currency
      - failure_code
      - attempt
      - failed_at
      properties:
        mode:
          $ref: '#/components/schemas/Mode'
        scheduled_payment_id:
          $ref: '#/components/schemas/ScheduledPaymentId'
        mandate_id:
          $ref: '#/components/schemas/MandateId'
        merchant_id:
          $ref: '#/components/schemas/MerchantId'
        period:
          $ref: '#/components/schemas/Period'
        amount_minor:
          allOf:
          - $ref: '#/components/schemas/AmountMinor'
          - minimum: 1
        currency:
          $ref: '#/components/schemas/Currency'
        failure_code:
          type: string
          enum:
          - insufficient_funds
          - merchant_suspended
          - ledger_unavailable
          - invalid_state_transition
          - internal_error
        attempt:
          type: integer
          minimum: 1
        failed_at:
          $ref: '#/components/schemas/Timestamp'
      description: El pago programado de un periodo falló
    ScheduledPaymentInsufficientFundsData:
      type: object
      additionalProperties: false
      required:
      - scheduled_payment_id
      - mandate_id
      - merchant_id
      - period
      - amount_minor
      - currency
      - required_minor
      - available_minor
      - attempt
      - retry_at
      properties:
        mode:
          $ref: '#/components/schemas/Mode'
        scheduled_payment_id:
          $ref: '#/components/schemas/ScheduledPaymentId'
        mandate_id:
          $ref: '#/components/schemas/MandateId'
        merchant_id:
          $ref: '#/components/schemas/MerchantId'
        period:
          $ref: '#/components/schemas/Period'
        amount_minor:
          allOf:
          - $ref: '#/components/schemas/AmountMinor'
          - minimum: 1
        currency:
          $ref: '#/components/schemas/Currency'
        required_minor:
          allOf:
          - $ref: '#/components/schemas/AmountMinor'
          - minimum: 1
        available_minor:
          $ref: '#/components/schemas/AmountMinor'
        attempt:
          type: integer
          minimum: 1
        retry_at:
          oneOf:
          - $ref: '#/components/schemas/Timestamp'
          - type: 'null'
      description: No hay fondos para el pago programado; se reintenta según la política
    Mode:
      type: string
      enum:
      - test
      - live
      description: Modo de la CLAVE que originó el hecho (D-28). Opcional mientras el productor no lo implemente (ola 2); los
        eventos públicos lo llevan para que un consumidor distinga un hecho `test` de uno `live`. No es el modo del despliegue
        (`sandbox|live`).
